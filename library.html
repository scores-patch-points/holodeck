<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library search — holodeck</title>
<style>
  :root { color-scheme: dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --mut:#898781; --line:#2c2c2a; --acc:#8b5cf6; --ok:#1baf7a; --warn:#eda100; }
  * { box-sizing:border-box } body { margin:0; background:var(--page); color:var(--ink); font:400 15px/1.5 'Hanken Grotesk',system-ui,sans-serif }
  header { padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--page); z-index:2 }
  h1 { font:600 16px 'Hanken Grotesk'; margin:0 0 2px } .sub { color:var(--mut); font:400 12px 'JetBrains Mono',monospace }
  form { display:flex; gap:8px; margin-top:12px }
  input { flex:1; background:var(--surface); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:9px 12px; font:500 14px 'JetBrains Mono',monospace; outline:none }
  button { background:var(--acc); border:0; color:#fff; border-radius:8px; padding:9px 16px; font:600 14px 'Hanken Grotesk'; cursor:pointer }
  main { padding:16px 22px 60px; max-width:900px }
  h2 { font:600 13px 'JetBrains Mono',monospace; color:var(--mut); text-transform:uppercase; letter-spacing:.06em; margin:22px 0 8px }
  .hit { border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:9px; background:var(--surface) }
  .hit .t { font:600 14px 'Hanken Grotesk' } .hit .s { color:var(--mut); font:400 12.5px 'JetBrains Mono',monospace; margin-top:4px }
  .hit .q { color:var(--ink); margin-top:7px; font:400 13.5px/1.45 'Newsreader',serif }
  .badge { font:500 11px 'JetBrains Mono',monospace; padding:1px 6px; border-radius:5px; margin-left:7px }
  .num { color:var(--acc) } .null { color:var(--mut) } a { color:#7aa2ff } mark { background:#3a2a66; color:#fff }
  .note { color:var(--mut); font:400 12.5px 'JetBrains Mono',monospace }
</style>
</head>
<body>
<header>
  <h1>Library search</h1>
  <div class="sub" id="status">loading store…</div>
  <form id="f"><input id="q" placeholder="search the library — a term, or a meaning" autocomplete="off"><button>Search</button></form>
</header>
<main>
  <div id="out"></div>
</main>
<script type="module">
import { openStore } from './holodeck-store.js';

const OLLAMA = 'http://127.0.0.1:11435';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const mark = (s, q) => esc(s).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
async function embed(text) {
  const r = await fetch(`${OLLAMA}/api/embed`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ model: 'nomic-embed-text', input: [text] }) });
  if (!r.ok) throw new Error('embed ' + r.status);
  return new Float32Array((await r.json()).embeddings[0]);
}

let store = null;
openStore({ corpus: 'nashville' }).then((s) => {
  store = s;
  $('#status').textContent = `${s.count().toLocaleString()} items · lexical baseline + semantic proposer (lift measured against a null) · ${s.hasVectors() ? 'vectors ready' : 'no vectors'}`;
}).catch((e) => { $('#status').textContent = 'store failed: ' + e.message; });

$('#f').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!store) return;
  const q = $('#q').value.trim();
  if (!q) return;
  $('#status').textContent = 'searching…';
  const out = $('#out'); out.innerHTML = '';

  const lex = await store.searchLexical(q, { limit: 12 });
  out.innerHTML += `<h2>Lexical baseline · ${lex.length} hit(s)</h2>` + (lex.length ? lex.map((h) => `
    <div class="hit"><div class="t">${esc(h.title)}</div>
      <div class="q">…${mark(h.snippet, q)}…</div>
      <div class="s">span ${h.start}–${h.end}${h.pointer ? ` · <a href="${esc(h.pointer.url || h.pointer.archive || '#')}" target="_blank" rel="noopener">open source ↗</a>` : ''}</div>
    </div>`).join('') : '<div class="note">no lexical hit</div>');

  let sem = null;
  try { sem = await store.searchSemantic(q, { embed, limit: 12 }); } catch (e) { sem = { error: e.message }; }
  if (sem && sem.hits) {
    out.innerHTML += `<h2>Semantic proposer · top ${sem.hits[0].score} vs null ${sem.topNull} (lift ${sem.lift})</h2>` + sem.hits.map((h, i) => `
      <div class="hit"><div class="t">${esc(h.title || h.id)}
        <span class="badge num">${h.score}</span><span class="badge null">null ${sem.null[i] ? sem.null[i].score : ''}</span></div>
        <div class="s">proposal — confirm by reading</div></div>`).join('');
  } else if (sem) {
    out.innerHTML += `<h2>Semantic proposer</h2><div class="note">unavailable: ${esc(sem.error || 'no vectors')}</div>`;
  }
  $('#status').textContent = `“${q}” — ${lex.length} lexical, ${sem && sem.hits ? sem.hits.length : 0} semantic`;
});
</script>
</body>
</html>
