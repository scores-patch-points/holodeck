<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Fold</title>
<style>
  :root {
    --bg: #ffffff; --side: #f7f7f8; --side2: #efeff1; --line: #e3e3e6; --line2: #d7d7db;
    --ink: #0d0d0d; --ink2: #3c3c43; --mut: #6b6b74; --dim: #9a9aa3;
    --acc: #0f6fff; --acc-soft: #e8f0ff; --ok: #1a7f37; --ok-soft: #e6f4ea;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 30px rgba(0,0,0,.06);
  }
  html[data-theme="dark"] {
    --bg: #0f0f10; --side: #171718; --side2: #212123; --line: #2a2a2d; --line2: #38383c;
    --ink: #f2f2f3; --ink2: #c9c9cf; --mut: #9a9aa3; --dim: #6b6b74;
    --acc: #5b9dff; --acc-soft: #17243a; --ok: #56d364; --ok-soft: #14291a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 30px rgba(0,0,0,.5);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14.5px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------------- icon rail ---------------- */
  .rail { width: 52px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 4px; }
  .rail button { width: 36px; height: 36px; border: none; background: transparent; border-radius: 9px; display: grid; place-items: center; color: var(--ink2); }
  .rail button:hover { background: var(--side2); }
  .rail button.on { background: var(--acc-soft); color: var(--acc); }
  .rail .sp { flex: 1; }
  .rail .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--acc); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .rail svg { width: 19px; height: 19px; }

  /* ---------------- chat sidebar ---------------- */
  .side { width: 268px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  .side.hide { display: none; }
  .side-top { padding: 12px 12px 6px; }
  .endpoint { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-weight: 600; }
  .endpoint .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); }
  .endpoint .caret { margin-left: auto; color: var(--mut); }
  .models { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .model { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 10px; color: var(--ink2); }
  .model:hover { background: var(--side2); }
  .model.on { background: var(--side2); color: var(--ink); font-weight: 600; }
  .model .pdot { width: 16px; height: 16px; border-radius: 5px; flex: none; background: var(--acc); }
  .model .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model .seal { margin-left: auto; font-size: 10px; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: 0 6px; }

  .side-scroll { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
  .sec { margin-top: 8px; }
  .sec-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; color: var(--mut); font-size: 12.5px; font-weight: 600; }
  .sec-head button { margin-left: auto; border: none; background: transparent; color: var(--mut); }
  .sec-head button:hover { color: var(--ink); }
  .folder { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; color: var(--ink2); }
  .folder:hover { background: var(--side2); }
  .folder.on { background: var(--side2); color: var(--ink); }
  .folder svg { width: 16px; height: 16px; color: var(--mut); }
  .group { margin-top: 10px; }
  .group-label { padding: 4px 10px; color: var(--dim); font-size: 11.5px; font-weight: 600; text-transform: none; }
  .chat { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 9px; color: var(--ink2); }
  .chat:hover { background: var(--side2); }
  .chat.on { background: var(--acc-soft); color: var(--ink); }
  .chat .cicon { width: 16px; height: 16px; border-radius: 5px; flex: none; background: var(--dim); opacity: .6; }
  .chat .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat .menu { margin-left: auto; opacity: 0; border: none; background: transparent; color: var(--mut); }
  .chat:hover .menu { opacity: 1; }
  .empty-hint { padding: 8px 10px; color: var(--dim); font-size: 12.5px; }

  /* ---------------- main ---------------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
  .pill { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; background: var(--bg); font-weight: 600; }
  .pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); }
  .iconbtn { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); display: grid; place-items: center; color: var(--ink2); }
  .iconbtn:hover { background: var(--side); }
  .topbar .sp { flex: 1; }
  .sealbadge { font-size: 11px; padding: 3px 10px; border-radius: 999px; }
  .seal-on { color: var(--ok); background: var(--ok-soft); border: 1px solid var(--ok); }
  .seal-off { color: var(--mut); background: var(--side2); border: 1px solid var(--line); }

  .stage { padding: 0 18px; height: 18px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mut); }

  .thread { flex: 1; overflow-y: auto; padding: 18px 0 8px; }
  .thread .col { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 18px; }
  .msg { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--acc); }
  .msg.user .av { background: #8b5cf6; }
  .body { min-width: 0; white-space: pre-wrap; word-break: break-word; }
  .msg.assistant .body { color: var(--ink); }
  .sealed-body { border-left: 2px solid var(--ok); padding-left: 10px; }
  .live::after { content: "▍"; color: var(--acc); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .art { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: 10px 0; background: var(--side); }
  .art-bar { display: flex; align-items: center; gap: 8px; padding: 7px 11px; background: var(--side2); }
  .art-title { font-weight: 600; font-size: 13px; }
  .art-kind { font-size: 11px; color: var(--mut); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .art-sp { flex: 1; }
  .art-btn { background: var(--bg); border: 1px solid var(--line); color: var(--mut); border-radius: 7px; font-size: 12px; padding: 2px 8px; }
  .art-btn:hover { color: var(--ink); }
  .art-inner iframe { width: 100%; height: 340px; border: 0; background: #fff; }
  .art-code { margin: 0; padding: 12px 14px; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-x: auto; white-space: pre; }
  .art-note { font-size: 12px; color: var(--mut); padding: 4px 14px 12px; }
  .actions { display: flex; gap: 10px; margin-top: 7px; opacity: 0; transition: opacity .15s; }
  .msg:hover .actions { opacity: 1; }
  .act { background: transparent; border: none; color: var(--mut); font-size: 12px; padding: 0; }
  .act:hover { color: var(--acc); text-decoration: underline; }

  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding-bottom: 8vh; }
  .welcome .mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #0f6fff, #22c1a4); display: grid; place-items: center; color: #fff; font: 700 26px/1 "Newsreader", Georgia, serif; margin-bottom: 6px; }
  .welcome h1 { font: 600 30px/1.2 "Newsreader", Georgia, serif; margin: 0; }
  .welcome p { color: var(--mut); margin: 0; }

  .composer-wrap { padding: 0 20px 8px; }
  .modebar { max-width: 760px; margin: 0 auto 6px; display: flex; gap: 4px; }
  .modebtn { border: 1px solid var(--line); background: var(--bg); color: var(--mut); border-radius: 999px; padding: 4px 14px; font-size: 12.5px; font-weight: 600; }
  .modebtn.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .activity { border: 1px solid var(--line); border-radius: 10px; background: var(--side); padding: 8px 10px; margin: 4px 0 10px; }
  .actrow { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mut); }
  .composer { max-width: 760px; margin: 0 auto; border: 1px solid var(--line2); border-radius: 26px; background: var(--bg); box-shadow: var(--shadow); display: flex; align-items: flex-end; gap: 6px; padding: 8px 10px 8px 14px; }
  .composer:focus-within { border-color: var(--acc); }
  .composer textarea { flex: 1; border: none; outline: none; resize: none; background: transparent; color: var(--ink); font: inherit; padding: 8px 0; max-height: 200px; }
  .composer .cbtn { width: 38px; height: 38px; border: none; border-radius: 50%; background: transparent; color: var(--mut); display: grid; place-items: center; }
  .composer .cbtn:hover { background: var(--side2); color: var(--ink); }
  .composer .cbtn.send { background: var(--acc); color: #fff; }
  .composer .cbtn.send:disabled { opacity: .4; }
  .composer svg { width: 19px; height: 19px; }

  .footer { text-align: center; color: var(--dim); font-size: 12px; padding: 6px 0 12px; }
  .footer a { color: var(--dim); }

  .drawer { border-top: 1px solid var(--line); padding: 14px 20px; max-height: 42vh; overflow-y: auto; font-size: 13px; }
  .drawer h3 { margin: 0 0 6px; font-size: 13px; color: var(--mut); }
  .invariant { color: var(--ok); }
  .ledger { border-collapse: collapse; margin-top: 10px; width: 100%; font-size: 12px; }
  .ledger th, .ledger td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .ledger th { color: var(--mut); }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .95; }
  @media (max-width: 720px) { .side { display: none; } .side.show { display: flex; position: absolute; z-index: 20; height: 100%; } }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <button id="railToggle" title="Toggle sidebar" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
    </button>
    <button id="railNew" title="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <button id="railSearch" title="Search chats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </button>
    <button id="railEvidence" title="Evidence — who did the work">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    </button>
    <button id="railTheme" title="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <div class="sp"></div>
    <div class="avatar" title="The Fold">F</div>
  </nav>

  <aside class="side" id="side">
    <div class="side-top">
      <div class="endpoint"><span class="dot"></span> The Fold <span class="caret">⌄</span></div>
      <div class="models" id="models"></div>
    </div>
    <div class="side-scroll">
      <div class="sec">
        <div class="sec-head">Projects <button id="projAdd" title="New project">＋</button></div>
        <div id="projects"></div>
      </div>
      <div class="sec">
        <div class="sec-head">Chats <button id="chatNew" title="New chat">＋</button></div>
        <div id="chats"></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="pill" id="endpointPill"><span class="dot"></span> The Fold</button>
      <button class="iconbtn" id="topNew" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <button class="iconbtn" id="topPlus" title="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <div class="sp"></div>
      <span class="sealbadge seal-off" id="sealBadge">sealed-external</span>
      <button class="iconbtn" id="topFocus" title="Focus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
    </div>

    <div class="welcome" id="welcome">
      <div class="mark">F</div>
      <h1>The Fold</h1>
      <p id="welcomeSub">Chat with the fold</p>
    </div>
    <div class="thread" id="thread" style="display:none"><div class="col" id="threadCol"></div></div>
    <div class="stage" id="stage"></div>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <button type="button" class="cbtn" id="attach" title="Attach (coming soon)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21.4 11.05l-9.19 9.19a5 5 0 0 1-7.07-7.07l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Message the fold"></textarea>
        <button type="button" class="cbtn" id="mic" title="Voice (coming soon)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <button type="submit" class="cbtn send" id="send" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="6 11 12 5 18 11"/></svg>
        </button>
      </form>
    </div>
    <div class="footer">The Fold · chat <span id="ver"></span> · models routed by heimdall · <a href="#" id="footEvidence">evidence</a></div>
    <section class="drawer" id="drawer" style="display:none"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script type="module">
  import { mount } from "./fold-chat.js";
  mount(document.querySelector(".app"));
</script>
</body>
</html>
