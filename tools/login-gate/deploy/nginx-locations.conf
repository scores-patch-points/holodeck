# Inside the homeserver's `server { … }` block, BEFORE the `location /_matrix/ { … }` that proxies to Synapse.
# Regex locations are tried before a plain prefix location, so these win for exactly these paths and nothing else.
# Every version of the path Synapse serves is covered (r0, v3, unstable, and the legacy api/v1): leaving one out
# would be a way around the code.
# `X-Forwarded-For $remote_addr` OVERWRITES the header (never append): the gate trusts it.

location ~ ^/_matrix/client/(api/v1|r0|v3|unstable)/(login|register)$ {
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    client_max_body_size 64k;
}
location /gate/ {
    proxy_pass http://127.0.0.1:8791;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    client_max_body_size 64k;
}
