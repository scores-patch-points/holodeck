<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the fold — power map</title>
<style>
/* The same graphite tokens as the Holodeck (index.html), so a map made here belongs to the same surface. */
:root{--bg:#17171a;--s1:#1c1c20;--s2:#29292e;--sel:#26272c;--line:#2e2e33;--line2:#3f3f46;--ink:#f4f4f6;--ink2:#c9c9d2;--mut:#9d9da8;--dim:#9494a0;--acc:#8ab4ff;--amber:#f0b429;--bad:#f87171;--ok:#56d364;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
:root[data-theme=light]{--bg:#fff;--s1:#fff;--s2:#f1f1f4;--sel:#eef0f4;--line:#e4e4e9;--line2:#cfcfd7;--ink:#141416;--ink2:#44444e;--mut:#5f5f6b;--dim:#666673;--acc:#1d4ed8;--amber:#a04a07;--bad:#c62828;--ok:#16793a;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
a{color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;white-space:nowrap}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header .grow{flex:1 1 16rem;min-width:0}
h1{font:600 15px var(--sans);margin:0 8px 0 0;display:flex;align-items:center;gap:8px}
h1 .dot{width:11px;height:11px;border-radius:3px;background:var(--acc)}
input,select,textarea{background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
select option{background:var(--s1);color:var(--ink)}
button{background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;color:var(--ink)}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#0b1220;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:default}
main{display:grid;grid-template-columns:minmax(300px,360px) 1fr;gap:0;min-height:calc(100vh - 56px)}
@media(max-width:820px){main{grid-template-columns:1fr}}
.panel{border-right:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 56px);overflow:auto}
.stage{padding:14px;overflow:auto;background:repeating-linear-gradient(0deg,transparent,transparent 23px,color-mix(in srgb,var(--line) 40%,transparent) 24px),repeating-linear-gradient(90deg,transparent,transparent 23px,color-mix(in srgb,var(--line) 40%,transparent) 24px)}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>label{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;gap:6px;align-items:center}
.row>*{min-width:0}
.row input{flex:1}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:7px}
.item:hover{background:var(--s2)}
.item.on{background:var(--sel);box-shadow:inset 0 0 0 1px var(--acc)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{color:var(--mut);padding:2px 6px;border-radius:6px}
.item .x:hover{color:var(--bad);background:var(--s1)}
.kind{font:600 9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:1px 7px;border:1px solid var(--line2);color:var(--ink2)}
.kind.person{border-color:#6fb0dc;color:#6fb0dc}
.kind.org{border-color:#e0a35c;color:#e0a35c}
.kind.fund{border-color:#8ad3a0;color:#8ad3a0}
.rel{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink2)}
.rel .cat{font:600 9.5px var(--mono);text-transform:uppercase;color:var(--acc)}
.rel .arrow{color:var(--dim)}
.muted{color:var(--mut);font-size:12.5px}
.hint{color:var(--mut);font-size:12px;line-height:1.45}
.err{color:var(--bad);font-size:12.5px}
.ok{color:var(--ok);font-size:12.5px}
svg{max-width:100%;height:auto;display:block}
.pm-node{cursor:pointer}
.pm-node:hover rect{stroke-width:2.5}
textarea{width:100%;min-height:76px;font:12px var(--mono);resize:vertical}
.badge{font:600 11px var(--mono);color:var(--mut)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font:600 12px var(--sans);color:var(--ink2)}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Power map</h1>
  <span class="grow"><input id="title" placeholder="Name this map (e.g. Acme and the people around it)" style="width:100%"></span>
  <span id="stats" class="badge"></span>
  <button id="theme" class="ghost" title="Light or dark">◐</button>
</header>

<main>
  <div class="panel">
    <div class="sec">
      <label>Entities</label>
      <div class="row">
        <input id="entName" placeholder="A person or organization" onkeydown="if(event.key==='Enter')PM.addEntity()">
        <select id="entKind" title="What kind of thing it is">
          <option value="person">Person</option>
          <option value="org">Organization</option>
          <option value="fund">Fund</option>
          <option value="other">Name</option>
        </select>
        <button class="primary" id="entAdd" title="Add this entity">＋</button>
      </div>
      <div id="entList" class="list"></div>
    </div>

    <div class="sec">
      <label>Relations</label>
      <div class="row">
        <select id="relFrom" title="Who holds / gives / owns"></select>
        <select id="relCat" title="What kind of relation"></select>
        <select id="relTo" title="What is held / receives"></select>
        <button class="primary" id="relAdd" title="Add this relation">＋</button>
      </div>
      <div id="relList" class="list"></div>
    </div>

    <details open>
      <summary>Import</summary>
      <div class="sec" style="margin-top:8px">
        <div class="row">
          <button id="impLS" class="ghost" title="Paste LittleSis entities + relationships JSON">LittleSis JSON…</button>
          <button id="impTies" class="ghost" title="Paste the Holodeck map's names and ties">Names &amp; ties…</button>
          <button id="impFile" class="ghost">File…</button>
          <input id="file" type="file" accept=".json,application/json" hidden>
        </div>
        <textarea id="impText" placeholder='Paste JSON here, then choose a format above.&#10;&#10;LittleSis: {"entities":[…],"relationships":[…]} or the API v2 {"data":[…]} shape.&#10;Names &amp; ties: {"nodes":[{"n":"Jane Roe","c":5,"type":"Person"}],"edges":[{"a":"Jane Roe","b":"Acme PAC","c":2}]}'></textarea>
        <div id="impMsg"></div>
      </div>
    </details>

    <details>
      <summary>Export</summary>
      <div class="sec" style="margin-top:8px">
        <div class="row">
          <button id="expSvg" class="ghost">Download SVG</button>
          <button id="expJson" class="ghost">Download JSON</button>
        </div>
        <div class="row">
          <button id="sample" class="ghost">Load a sample</button>
          <button id="clear" class="ghost">Clear</button>
        </div>
      </div>
    </details>

    <p class="hint">A power map is a directed graph: the holder at the top, what it holds below. Cycles are broken when the map is laid out — the dropped relation is listed, never hidden. Everything stays in this browser.</p>
  </div>

  <div class="stage" id="stage"></div>
</main>

<script type="module">
import {
  createGraph, addEntity, addRelation, removeEntity, removeRelation,
  entityByName, idOf, findEntity, RELATION_CATEGORIES, ENTITY_KINDS, KIND_LABEL,
  layoutGraph, toSvg, fromLittleSis, fromTies, toJSON, fromJSON, graphStats, isDag,
} from './holodeck-power-map.js';

const $ = (id) => document.getElementById(id);
const STORE = 'holodeck:power-map';
let G = createGraph();
let sel = null;
let msg = { kind: '', text: '' };

try { const t = localStorage.getItem('holodeck:theme'); if (t === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}

function save() { try { localStorage.setItem(STORE, toJSON(G)); } catch (e) {} }
function load() {
  try { const s = localStorage.getItem(STORE); if (s) { G = fromJSON(s); return; } } catch (e) {}
  G = sample();
}
function sample() {
  let g = createGraph({ title: 'Acme and the people around it' });
  const ids = {};
  for (const [name, kind] of [['Jane Roe', 'person'], ['Acme PAC', 'org'], ['Acme Holdings', 'org'], ['Sen. Public', 'person'], ['Roe Family Trust', 'fund']]) {
    const r = addEntity(g, { name, kind }); g = r.graph; ids[name] = r.id;
  }
  const rels = [['Jane Roe', 'Acme PAC', 'donation'], ['Acme PAC', 'Sen. Public', 'donation'], ['Acme Holdings', 'Acme PAC', 'ownership'], ['Roe Family Trust', 'Acme Holdings', 'ownership'], ['Jane Roe', 'Roe Family Trust', 'family'], ['Sen. Public', 'Acme Holdings', 'position']];
  for (const [a, b, c] of rels) g = addRelation(g, { from: ids[a], to: ids[b], category: c });
  return g;
}

// ── render ──────────────────────────────────────────────────────────────────────────────────────────
function option(v, label, on) { const o = document.createElement('option'); o.value = v; o.textContent = label; if (on) o.selected = true; return o; }
function fillSelects() {
  const opts = G.entities;
  for (const [id, ph] of [['relFrom', 'from…'], ['relTo', 'to…']]) {
    const el = $(id), keep = el.value; el.replaceChildren();
    if (!opts.length) { el.appendChild(option('', ph)); continue; }
    opts.forEach((e) => el.appendChild(option(e.id, e.name, e.id === keep)));
  }
  const cat = $('relCat'), keepC = cat.value; cat.replaceChildren();
  RELATION_CATEGORIES.forEach((c) => cat.appendChild(option(c, c, c === keepC)));
}
function entRow(e) {
  const row = document.createElement('div'); row.className = 'item' + (sel === e.id ? ' on' : '');
  const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name; nm.title = e.note || e.name;
  const k = document.createElement('span'); k.className = 'kind ' + e.kind; k.textContent = KIND_LABEL[e.kind] || e.kind;
  const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕'; x.title = 'Remove this entity and its relations';
  x.onclick = (ev) => { ev.stopPropagation(); G = removeEntity(G, e.id); if (sel === e.id) sel = null; after(); };
  row.append(nm, k, x);
  row.onclick = () => { sel = sel === e.id ? null : e.id; render(); };
  return row;
}
function relRow(r) {
  const a = findEntity(G, r.from), b = findEntity(G, r.to); if (!a || !b) return null;
  const row = document.createElement('div'); row.className = 'item rel';
  const f = document.createElement('span'); f.className = 'nm'; f.textContent = a.name;
  const c = document.createElement('span'); c.className = 'cat'; c.textContent = r.category;
  const ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '→';
  const t = document.createElement('span'); t.className = 'nm'; t.textContent = b.name;
  const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕'; x.title = 'Remove this relation';
  x.onclick = () => { G = removeRelation(G, r.id); after(); };
  row.append(f, c, ar, t, x);
  return row;
}
function render() {
  $('title').value = G.title || '';
  fillSelects();
  const el = $('entList'); el.replaceChildren();
  if (!G.entities.length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'No entities yet. Add one above, import, or load a sample.'; el.appendChild(p); }
  G.entities.forEach((e) => el.appendChild(entRow(e)));
  const rl = $('relList'); rl.replaceChildren();
  if (!G.relations.length) { const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'No relations yet.'; rl.appendChild(p); }
  G.relations.forEach((r) => { const row = relRow(r); if (row) rl.appendChild(row); });
  $('relAdd').disabled = !(G.entities.length >= 2);
  const s = graphStats(G);
  $('stats').textContent = s.summary;
  $('stats').style.color = s.dag ? 'var(--mut)' : 'var(--amber)';
  drawStage();
}
function drawStage() {
  const stage = $('stage');
  if (!G.entities.length) { stage.innerHTML = '<p class="hint" style="color:var(--mut)">The map appears here.</p>'; return; }
  const L = layoutGraph(G, { width: Math.max(600, stage.clientWidth - 30) });
  const svg = toSvg(L, { title: G.title || '', fontSize: 12.5 });
  stage.innerHTML = svg;
  if (L.removed.length) {
    const n = document.createElement('p'); n.className = 'err'; n.style.marginTop = '10px';
    n.textContent = 'Cycle broken for layout — dropped ' + L.removed.map((r) => (findEntity(G, r.from) || {}).name + ' → ' + (findEntity(G, r.to) || {}).name + ' (' + r.category + ')').join(', ') + '.';
    stage.appendChild(n);
  }
  stage.querySelectorAll('.pm-node').forEach((g) => {
    g.addEventListener('click', () => { sel = sel === g.dataset.id ? null : g.dataset.id; render(); });
  });
}
function after() { save(); render(); }

// ── actions ─────────────────────────────────────────────────────────────────────────────────────────
window.PM = {
  addEntity() {
    const name = $('entName').value.trim(); if (!name) return;
    const r = addEntity(G, { name, kind: $('entKind').value }); G = r.graph; $('entName').value = '';
    sel = r.id; after();
  },
};
$('entAdd').onclick = () => PM.addEntity();
$('relAdd').onclick = () => {
  const from = $('relFrom').value, to = $('relTo').value, category = $('relCat').value;
  if (!from || !to || from === to) { flash('Pick two different entities.', 'err'); return; }
  G = addRelation(G, { from, to, category }); after();
};
$('title').oninput = (e) => { G = { ...G, title: e.target.value }; save(); drawStage(); };
$('clear').onclick = () => { G = createGraph(); sel = null; after(); };
$('sample').onclick = () => { G = sample(); sel = null; after(); };
$('theme').onclick = () => {
  const light = document.documentElement.dataset.theme !== 'light';
  if (light) document.documentElement.dataset.theme = 'light'; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('holodeck:theme', light ? 'light' : 'dark'); } catch (e) {}
  render();
};

function flash(text, kind) { msg = { text, kind }; const el = $('impMsg'); el.className = kind || 'muted'; el.textContent = text; }
function importJSON(text, mode) {
  try {
    const o = JSON.parse(text);
    if (mode === 'ties') {
      const nodes = o.nodes || o.names || []; const edges = o.edges || o.ties || [];
      if (!nodes.length) throw new Error('no nodes');
      G = fromTies(nodes, edges, { title: o.title || 'Names and their ties' });
    } else if (mode === 'ls') {
      const ents = o.entities || (o.data && o.data.filter ? o.data : []); const rels = o.relationships || [];
      G = fromLittleSis(ents, rels, { title: o.title || 'LittleSis import' });
    } else {
      G = fromJSON(o);
    }
    sel = null; after();
    flash('Imported ' + graphStats(G).summary + (isDag(G) ? '' : ' — a cycle was found and will be broken when drawn.'), 'ok');
  } catch (e) { flash('Could not read that JSON: ' + e.message, 'err'); }
}
$('impLS').onclick = () => { const t = $('impText').value.trim(); if (!t) return flash('Paste LittleSis JSON into the box first.', 'err'); importJSON(t, 'ls'); };
$('impTies').onclick = () => { const t = $('impText').value.trim(); if (!t) return flash('Paste names-and-ties JSON into the box first.', 'err'); importJSON(t, 'ties'); };
$('impFile').onclick = () => $('file').click();
$('file').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => importJSON(String(rd.result), 'json'); rd.readAsText(f); e.target.value = ''; };

function download(name, text, type) {
  const b = new Blob([text], { type }); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}
const slug = (s) => (String(s || 'power-map').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'power-map');
$('expSvg').onclick = () => {
  if (!G.entities.length) return flash('Nothing to export yet.', 'err');
  const L = layoutGraph(G, { width: Math.max(700, $('stage').clientWidth - 30) });
  download(slug(G.title) + '.svg', toSvg(L, { title: G.title || '', fontSize: 12.5 }), 'image/svg+xml');
};
$('expJson').onclick = () => download(slug(G.title) + '.json', toJSON(G), 'application/json');

// seed the relation selects as entities change
new MutationObserver(() => {}).observe(document.body, { childList: true, subtree: false });

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawStage, 150); });
load(); render();
</script>
</body>
</html>
