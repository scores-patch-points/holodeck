<!doctype html><meta charset="utf-8"><title>Reader eval and rule learning</title>
<style>body{font:13px/1.5 system-ui;margin:20px;max-width:1100px}pre{background:#f4f4f4;padding:10px;overflow:auto}td,th{padding:2px 8px;border-bottom:1px solid #ddd;text-align:left}</style>
<h1>Reader eval and rule learning</h1><button id="go">Run</button> <button id="real">Real documents</button> <span id="st"></span><div id="out"></div>
<script type="module">
import { corpus, toPng } from './corpus.js';
import { browserOcr } from '../../holodeck-ocr.js';
import { fieldsOf, semanticOf, STRUCTURE_RULES } from '../page-views.js';
import { observe, learn, apply, score, canon } from '../learned.js';
import { similarity } from '../prior-tilt.js';
const tableOk = (t, truth) => { const cols = truth.columns || [], recs = truth.records || []; if (!cols.length) return false; const byCols = t[2].columns.filter((c) => cols.some((k) => similarity(c, k) > 0.7)).length >= Math.ceil(cols.length * 0.6); const hit = recs.filter((rec) => t[1].some((row) => similarity(String(row[0]), String(rec[cols[0]])) > 0.8)).length; return byCols || (recs.length > 0 && hit >= recs.length * 0.6); };
const $ = (id) => document.getElementById(id), alnum = (s) => canon(s).replace(/_/g, '');
const N = +(new URLSearchParams(location.search).get('n') || 24), SEED = +(new URLSearchParams(location.search).get('seed') || 1);
window.RESULT = null;
// OCR is the slow part and does not change when the reading code does: keep each result (images stripped) in this browser, keyed by the document
const idb = () => new Promise((res, rej) => { const q = indexedDB.open('reader-eval', 1); q.onupgradeneeded = () => q.result.createObjectStore('ocr'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const kv = async (mode, fn) => { const db = await idb(); return new Promise((res) => { const t = db.transaction('ocr', mode), r = fn(t.objectStore('ocr')); t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); }); };
const cacheKey = (d) => `${SEED}|${d.id}|${d.canvas.width}x${d.canvas.height}|${JSON.stringify(d.deg)}|${d.face}`;
async function ocrCached(d) {
  const k = cacheKey(d), hit = await kv('readonly', (s) => s.get(k)); if (hit) return { ...hit, cached: true };
  const res = await browserOcr(await toPng(d.canvas), 'image', { langs: 'eng+fra+deu+spa' });
  const slim = { text: res.text, words: res.words, conf: res.conf, layout: { ...res.layout, pages: res.layout.pages.map((p) => ({ ...p, image: undefined })) } };
  await kv('readwrite', (s) => s.put(slim, k)); return slim;
}
$('go').onclick = async () => {
  const docs = corpus({ n: N, seed: SEED }), rows = [], obs = [], store = [];
  for (const [i, d] of docs.entries()) {
    $('st').textContent = `${i + 1}/${docs.length} ${d.id}`;
    let res; const t0 = performance.now();
    try { res = await ocrCached(d); } catch (er) { rows.push({ id: d.id, error: 'ocr: ' + er }); continue; }
    const ocrMs = Math.round(performance.now() - t0);
    try {
    const layout = res.layout, text = res.text, fields = fieldsOf(layout, text), sem = semanticOf(layout, text, fields);
    const flat = alnum(text), wordHit = d.truth.words.filter((w) => flat.includes(alnum(w))).length / Math.max(1, d.truth.words.length);
    const ob = observe(fields, d.truth.fields), bound = ob.bound.filter((b) => b.read).length, inText = d.truth.fields.filter((f) => flat.includes(alnum(f.value))).length;
    // tables: a ['table', rows, {columns}] on the page whose columns overlap the truth columns; rows whose first cell is a truth record's
    const tables = []; const walk = (t) => { if (Array.isArray(t) && t[0] === 'table' && t[2] && t[2].columns) tables.push(t); if (Array.isArray(t)) t.forEach(walk); }; walk(sem);
    const cols = d.truth.columns || [], tbl = tables.find((t) => tableOk(t, d.truth));
    const recs = d.truth.records || [], recHit = tbl ? recs.filter((rec) => tbl[1].some((row) => similarity(String(row[0]), String(rec[cols[0]])) > 0.8)).length : 0;
    const titles = []; const walkS = (t) => { if (Array.isArray(t) && Array.isArray(t[1]) && t[2] && t[2].by && /heading|marker|type set|shift|capitals/.test(t[2].by)) titles.push(String(t[0])); if (Array.isArray(t)) t.forEach(walkS); }; walkS(sem);
    const heads = d.truth.headings || [], headHit = heads.filter((h) => titles.some((t) => similarity(t, h) > 0.75)).length;
    obs.push({ ...ob, id: d.id, family: d.family, lang: d.lang }); store.push({ d, layout, text, fields });
    rows.push({ id: d.id, family: d.family, lang: d.lang, face: d.face, px: d.px, deg: d.deg, ocrMs, ocrWords: res.words, ocrConf: res.conf, wordRecall: +wordHit.toFixed(3), fields: d.truth.fields.length, valuesInText: inText, bound, labelOk: ob.bound.filter((b) => b.read && b.labelSim >= 0.8).length, fmtOk: ob.bound.filter((b) => b.read && shapeOfSafe(fields, b)).length, tableFound: !!tbl, tables: tables.length, recs: recs.length, recHit, heads: heads.length, headHit });
    } catch (er) { rows.push({ id: d.id, error: String(er && er.stack || er).slice(0, 200) }); }
  }
  // learn on the even documents, test on the odd (held out), then falsify what does not help
  const side = (i) => (i + Math.floor(i / 6)) % 2, train = obs.filter((_, i) => side(i) === 0), test = obs.filter((_, i) => side(i) === 1);
  const rules = learn(train, { minSupport: 2 }), before = score([], test), after = score(rules, test);
  // STRUCTURE: the reader's own thresholds (tables, headings) are searched, not guessed — scored on how many tables and headings it finds and how many it invents
  const structScore = (items, R) => { let tT = 0, tF = 0, tFound = 0, hT = 0, hF = 0, hFound = 0, hExtra = 0;
    for (const { d, layout, text, fields } of items) { const sem = semanticOf(layout, text, fields, { rules: R }), tables = [], titles = []; const w = (t) => { if (Array.isArray(t) && t[0] === 'table' && t[2] && t[2].columns) tables.push(t); if (Array.isArray(t) && Array.isArray(t[1]) && t[2] && t[2].by && /heading|marker|type set|capitals/.test(t[2].by)) titles.push(String(t[0])); if (Array.isArray(t)) t.forEach(w); }; w(sem);
      const cols = d.truth.columns || [], want = cols.length ? 1 : 0; tT += want; const ok = cols.length && tables.some((t) => tableOk(t, d.truth)); if (ok) tFound++; tF += tables.length - (ok ? 1 : 0);
      const heads = d.truth.headings || []; hT += heads.length; const got = heads.filter((h) => titles.some((t) => similarity(t, h) > 0.75)).length; hFound += got; hExtra += Math.max(0, titles.length - got - (d.truth.headings ? 0 : 0)); }
    const rec = (a, b) => (b ? a / b : 1), prec = (found, extra) => (found + extra ? found / (found + extra) : 1); const tr = rec(tFound, tT), tp = prec(tFound, tF), hr = rec(hFound, hT), hp = prec(hFound, hExtra);
    return { tableRecall: +tr.toFixed(2), tablePrecision: +tp.toFixed(2), headRecall: +hr.toFixed(2), headPrecision: +hp.toFixed(2), f: +((2 * tr * tp) / ((tr + tp) || 1) + (2 * hr * hp) / ((hr + hp) || 1)).toFixed(3) }; };
  const trainS = store.filter((_, i) => side(i) === 0), testS = store.filter((_, i) => side(i) === 1), grid = [];
  for (const tableMinCells of [2, 3]) for (const tableMinRun of [2, 3]) for (const headCaps of [true, false]) for (const headSize of [1.2, 1.35, 1.6]) grid.push({ tableMinCells, tableMinRun, headCaps, headSize });
  const scored = grid.map((R) => ({ R, ...structScore(trainS, R) })).sort((a, b) => b.f - a.f), best = scored[0];
  const structure = { default: { rules: STRUCTURE_RULES, train: structScore(trainS, STRUCTURE_RULES), heldOut: structScore(testS, STRUCTURE_RULES) }, learned: { rules: best.R, train: { ...best, R: undefined }, heldOut: structScore(testS, best.R) }, searched: grid.length };
  structure.adopted = structure.learned.heldOut.f > structure.default.heldOut.f;
  const kept = rules.map((r) => { const without = rules.filter((x) => x !== r); const a = score(without, test), b = score(rules, test); const gain = (b.labelOk - a.labelOk) + (b.fmtOk - a.fmtOk) + (b.fixes - a.fixes) - 2 * (b.wrongFixes - a.wrongFixes); return { ...r, heldOutGain: gain, falsified: r.type === 'key' ? false : gain < 0 ? 'lowers the held-out score' : undefined }; });
  const program = { schema: 'ReadingProgram@1', giver: 'learned from a synthetic corpus whose truth was known (reading/eval/corpus.js), by reading/learned.js; held-out test on alternate documents', corpus: { n: docs.length, seed: SEED, trained: train.length, heldOut: test.length, families: [...new Set(docs.map((d) => d.family))], langs: [...new Set(docs.map((d) => d.lang))] }, heldOut: { before, after }, structure, rules: kept };
  window.RESULT = { rows, program }; window.STORE = store;
  $('st').textContent = 'done';
  $('out').innerHTML = `<h2>Held-out</h2><pre>${JSON.stringify({ before, after }, null, 1)}</pre><h2>Structure</h2><pre>${JSON.stringify(structure, null, 1)}</pre><h2>Rules (${kept.length})</h2><pre>${JSON.stringify(kept.slice(0, 40))}</pre><h2>Per document</h2><table><tr>${Object.keys(rows.find((r) => !r.error) || rows[0]).filter((k) => k !== 'deg').map((k) => `<th>${k}</th>`).join('')}</tr>${rows.map((r) => `<tr>${Object.entries(r).filter(([k]) => k !== 'deg').map(([, v]) => `<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;
};
import { shapeOf } from '../shapes.js';
function shapeOfSafe(fields, b) { return b.read.format === shapeOf(b.truth.value); }
</script>

<script type="module">
import { browserOcr } from '../../holodeck-ocr.js';
import { fieldsOf, semanticOf, STRUCTURE_RULES } from '../page-views.js';
const REAL = ['propublica-memo.pdf', 'symphony-990-2019-p1-4.pdf', 'symphony-990-2024-p1-3.pdf', 'foundation-990-2016-p1-4.pdf'];
const idb = () => new Promise((res, rej) => { const q = indexedDB.open('reader-eval', 1); q.onupgradeneeded = () => q.result.createObjectStore('ocr'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
const kv = async (mode, fn) => { const db = await idb(); return new Promise((res) => { const t = db.transaction('ocr', mode), r = fn(t.objectStore('ocr')); t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); }); };
const count = (sem) => { let tables = 0, rowsN = 0, sections = 0; const w = (t) => { if (!Array.isArray(t)) return; if (t[0] === 'table' && t[2] && t[2].columns) { tables++; rowsN += t[1].length; } else if (Array.isArray(t[1]) && t[2] && t[2].by && /heading|marker|type set|capitals|shift/.test(t[2].by)) sections++; t.forEach(w); }; w(sem); return { tables, rows: rowsN, sections }; };
document.getElementById('real').onclick = async () => {
  const learned = (await (await fetch('../learned-priors/reading-program-synthetic-v1.json')).json()).structure.learned.rules, out = [];
  for (const f of REAL) {
    document.getElementById('st').textContent = f;
    let hit = await kv('readonly', (s) => s.get('real|' + f));
    if (!hit) { const buf = new Uint8Array(await (await fetch('/.scratch-ocr/' + f)).arrayBuffer()), res = await browserOcr(buf, 'pdf', { langs: 'eng' }); hit = { text: res.text, words: res.words, conf: res.conf, layout: { ...res.layout, pages: res.layout.pages.map((p) => ({ ...p, image: undefined })) } }; await kv('readwrite', (s) => s.put(hit, 'real|' + f)); }
    const fields = fieldsOf(hit.layout, hit.text);
    out.push({ f, words: hit.words, conf: hit.conf, fields: fields.length, default: count(semanticOf(hit.layout, hit.text, fields)), learned: count(semanticOf(hit.layout, hit.text, fields, { rules: learned })) });
  }
  window.REAL = out; document.getElementById('st').textContent = 'real done';
};
</script>
