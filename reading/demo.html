<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading</title>
<style>
  :root{--bg:#17171a;--s1:#1c1c20;--s2:#29292e;--sel:#26272c;--sel2:#30333b;--line:#2e2e33;--line2:#3f3f46;--ink:#f4f4f6;--ink2:#c9c9d2;--mut:#9d9da8;--dim:#9494a0;--acc:#8ab4ff;--acc2:#8ab4ff;--acc3:#6d9dff;--amber:#f0b429;--blue:#8ab4ff;--green:#56d364;--pink:#e0a0c0;--date:#8ab4ff;--ok:#56d364;--bad:#f87171;--edge:#3f3f46;--hdr:rgba(23,23,26,.95);--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--serif:Georgia,"Times New Roman",serif;color-scheme:dark}
  :root{--f0:#9494a0;--f1:#c68bff;--f2:#56d364;--f3:#8ab4ff;--f4:#e0a0c0;--f5:#f0b429;--f6:#ff9d6e}  /*{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--acc)}
  button{font:inherit}
  /* ── landing ───────────────────────────────────────────────────────────── */
  header{padding:30px 28px 16px;border-bottom:1px solid var(--line);position:relative}
  header h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;font-family:var(--serif);font-weight:500}
  header .sub{color:var(--dim);max-width:960px;font-size:14px}
  header .sub b{color:var(--ink);font-weight:600}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px 80px}
  .drop{margin:20px 0;border:1.5px dashed var(--line2);border-radius:14px;background:var(--s1);padding:24px;text-align:center;transition:.15s;cursor:pointer}
  .drop.hot{border-color:var(--acc);background:#1a1d26}
  .drop .big{font-size:16px;font-weight:600}.drop .small{color:var(--dim);font-size:13px;margin-top:5px}
  textarea{width:100%;min-height:130px;background:var(--s1);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px;font:13px/1.5 var(--mono);resize:vertical;margin-top:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .row button{background:var(--s1);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font:13px var(--sans);cursor:pointer}
  .row button:hover{border-color:var(--acc);color:var(--acc)}
  .row button.primary{background:#1c2740;border-color:#33507f}
  .samples button{padding:5px 10px;font-size:12.5px}
  .badge{font:12.5px var(--mono);padding:1px 7px;border-radius:6px;background:#1a2130;color:var(--dim);border:1px solid var(--line)}
  .badge.live{color:var(--green);border-color:#245a41}
  .refuse{margin:12px 0;border:1px solid #5c2530;border-radius:12px;background:#201418;color:#f0c9cf;padding:12px 14px;font-size:13.5px}
  .refuse b{color:#fff}
  .refuse[hidden]{display:none}
  /* ── the app ───────────────────────────────────────────────────────────── */
  #app{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;grid-template-rows:auto 1fr auto;font:14px/1.45 var(--sans)}
  #app.on{display:grid}
  .top{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}
  .top h2{margin:0;font:500 19px/1.2 var(--serif);text-wrap:balance}
  .top .meta{font:12.5px var(--mono);color:var(--dim)}
  .top .sp{flex:1}
  .top button{all:unset;cursor:pointer;color:var(--mut);font:500 13px var(--sans);padding:4px 6px;border-radius:4px}
  .top button:hover{color:var(--ink)}
  .top button.f{font-weight:600}
  .top button.f[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc);border-radius:0}
  
  .top .stats{flex-basis:100%;font:12.5px var(--mono);color:var(--ink2);display:flex;gap:10px 16px;flex-wrap:wrap;padding-top:6px}
  .top .stats b{color:var(--ink);font-weight:600}.top .stats .g{color:var(--dim)}
  .sw{position:relative;width:36px;height:20px;border-radius:20px;background:#33333a;border:1px solid var(--line2);cursor:pointer;flex:none}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.14s}
  .sw[aria-checked=true]{background:#1e3a2b;border-color:#2f6b4b}
  .sw[aria-checked=true]::after{left:18px;background:var(--green)}
  .sw[aria-disabled=true]{opacity:.4;cursor:not-allowed}
  /* ── event log ─────────────────────────────────────────────────────────── */
  .log{display:grid;grid-template-rows:1fr auto;min-height:0}
  .rows{overflow-y:auto;position:relative;font:12.5px/24px var(--mono);min-height:0}
  .now{border-top:1px solid var(--line);padding:8px 14px 10px;min-height:74px}
  .now .k{font:600 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .now p{margin:4px 0 0;font-size:14px;color:var(--ink);max-width:74ch}
  /* source pane */
  .src{font:13px/1.7 var(--mono);color:var(--ink2);white-space:pre-wrap;word-break:break-word}
  .src .s{color:var(--ink2)}.src .nm{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
  .src .r{background:#15211a;box-shadow:inset 3px 0 0 var(--green)}
  /* tables */
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th, table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t th{position:sticky;top:0;background:var(--bg);color:var(--dim);font:600 12.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;z-index:2}
  table.t tr.cur{background:#20242e;box-shadow:inset 3px 0 0 var(--acc)}
  table.t th[data-sort]{cursor:pointer;user-select:none}
  table.t th[data-sort]:hover{color:var(--ink)}
  table.t td.n{color:var(--dim);font:12.5px var(--mono);text-align:right;width:34px}
  .mono{font-family:var(--mono);font-size:12.5px}
  .chip{display:inline-block;border:1px solid var(--line2);border-radius:20px;padding:0 8px;font:12.5px var(--mono);color:var(--dim);margin:2px 3px 2px 0}
  .chip.g{color:var(--green);border-color:#245a41}.chip.a{color:var(--amber);border-color:#5c4d1d}
  .chip.b{color:var(--blue);border-color:#234a6f}.chip.v{color:var(--bad);border-color:#5c2530}
  .gap{color:var(--bad)}
  .bar{display:inline-block;height:8px;background:#2b3a56;border-radius:3px;vertical-align:middle;min-width:2px}
  /* confidence */
  .conf{display:inline-flex;align-items:center;gap:6px;font:12.5px var(--mono);color:var(--mut);cursor:help}
  .conf .cbar{width:52px;height:7px;border-radius:4px;background:#2a2a30;overflow:hidden}
  .conf .cbar i{display:block;height:100%;background:linear-gradient(90deg,#6b8f6a,#56d364)}
  .conf.mid .cbar i{background:linear-gradient(90deg,#8a7a3a,#f0b429)}
  .conf.low .cbar i{background:linear-gradient(90deg,#7a3a3a,#f87171)}
  /* EOT + JSON */
  pre.json{background:#0f131b;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:60vh;font:12.5px/1.5 var(--mono);color:#c7d2e2;margin:6px 0;white-space:pre}
  .seg{display:inline-flex;gap:2px;margin-left:8px}
  .seg button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc);border-radius:0}
  .key{font:12.5px var(--mono);color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  .key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .delta{margin:8px 0;border:1px solid #5c4d1d;border-radius:9px;background:#221d10;color:#f0d9a0;padding:8px 11px;font-size:13px}
  .delta b{color:#fff}
  @keyframes revflash{0%,40%{background:var(--acc);color:#04121c}100%{background:transparent}}
  header .claim{color:var(--dim);font-size:13px;margin-top:6px}
  /* ── calm: one thing at a time. What is hidden is still there for the code; the page just stops shouting it. ── */
  #app .top .stats, #app .top [data-a="toggle-all"], #app .top [data-a="reset"], #app .top [data-a="copy"]{display:none}
  
  /* ── on a phone the layers become a swipeable row, the sentence and its lanes stay short, and the graph gets the screen ── */
  @media (max-width:900px){
    #app .top{padding:8px 12px;gap:6px}#app .top .meta{display:none}#app .top h2{font-size:16px;flex-basis:100%}
    #app .top button{min-height:40px;padding:6px 12px}#app .top [data-a="dl-json"]{display:none}
  }
  /* referents as a table — the same module as the reader's index (referent-table.js) */
  #app .rt{width:100%;border-collapse:collapse;font-size:13px}#app .rt th, #app .rt td{padding:6px 8px;text-align:left;font-weight:400;line-height:1.35;border-bottom:1px solid var(--line)}
  #app .rt thead th{font:600 11px var(--mono);color:var(--dim);white-space:nowrap}#app .rt thead button{all:unset;cursor:pointer;color:inherit;font:inherit}#app .rt thead button:hover{color:var(--ink)}
  #app .rt .ar{margin-left:3px;font-size:9px}#app .rt .num{text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--dim)}
  #app .rt tbody tr{cursor:pointer}#app .rt tbody tr:hover{background:var(--s1)}#app .rt tbody tr.sel{background:#1a1f2b}
  #app .rt .c-name{overflow-wrap:normal;word-break:normal;hyphens:manual;min-width:9ch}#app .rt .c-name>span:last-child{display:inline}#app .rt .num{width:1%;white-space:nowrap}#app .rt thead th.num, #app .rt thead th:not(:first-child){white-space:normal}#app .rt .c-name .dot{float:left;width:8px;height:8px;border-radius:50%;margin:5px 6px 0 0}
  #app .rt .sm{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:2px}#app .rt .c-reality{text-align:center;cursor:help}
  #app .rt .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  @media (max-width:900px){#app .rt tbody th, #app .rt tbody td, #app .rt thead th{height:40px}#app .rt .c-first{display:none}}
  #app .top h2{font-size:17px;font-weight:600}
  #app button{font-size:13px}
/* ── panels that read in one direction: the header is one line of title, then one line of controls; the rail fills its column; every tab is visible ── */
#app .top h2{flex-basis:100%}
#app .top .meta{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#app .top .sp{display:none}
  /* ── the editor's layout: index | viewer + timeline | inspector, the transport across the bottom. Only the playhead and the viewer's marks move while it plays. ── */
  #app{grid-template-columns:280px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 300px auto}
  @media (min-width:1200px){ #app{grid-template-columns:280px minmax(0,1fr) minmax(340px,400px)} }
  #app .top{grid-column:1/-1;grid-row:1}
  #app .index{grid-column:1;grid-row:2/4;border-right:1px solid var(--line);overflow:auto;min-height:0;min-width:0}
  #app .timeline{grid-column:2;grid-row:3;border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;background:#141417}
  #app .log{display:grid;grid-template-rows:minmax(0,1fr);height:100%;min-height:0}#app .log[hidden]{display:none}
  #app .seg button{border-radius:0;font-size:12px;padding:4px 9px;min-height:30px;background:none;border:0;color:var(--mut);cursor:pointer}
  #app .seg button[aria-pressed=true]{background:var(--sel);color:var(--ink)}
  
  #app .key{display:none}
  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr) 190px auto}
    #app .index{grid-column:1;grid-row:2;border-right:0;border-bottom:1px solid var(--line);overflow:visible}
    #app .timeline{grid-column:1;grid-row:4}
    #app .top h2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  }
</style>
</head>
<body>
<header>
  <h1>Reading</h1>
  <div class="claim">in your browser · no model · every reading traced to its bytes · a correction is a new event, nothing is overwritten</div>
</header>
<div class="wrap">
  <div id="drop" class="drop">
    <div class="big">drop a document here, or click to choose a file</div>
  </div>
  <input id="file" type="file" hidden>
  <textarea id="ta" placeholder="paste text"></textarea>
  <div class="row">
    <button id="read" class="primary">Read</button>
    <button id="clear">Clear</button>
    <button id="addsrc" title="Keep this text as one of several sources to read together">+ source</button>
    <span class="samples" id="samples">
      <button data-s="positions">sample 1</button>
      <button data-s="dossier">sample 2</button>
      <button data-s="history">sample 3</button>
      <button id="exsrc" title="Three sources on one ship">ship</button>
      <button data-doc="Report" title="A whole document, read end to end: the Board of Trade’s 1912 report on the loss of the Titanic (about 64,000 characters), from the Holodeck’s own published sample set">whole document</button>
    </span>
    <span id="model" class="badge live" hidden>model calls: 0</span>
  </div>
  <div id="refuse" class="refuse" hidden></div>
</div>

<div id="sources"></div>

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// "No model was called" is MEASURED: every network request this page makes is
// counted, and the only ones that appear are the static prior files read from
// disk. The badge shows the count live.
// ─────────────────────────────────────────────────────────────────────────────
const net = { requests: [], models: 0 };
const _fetch = window.fetch.bind(window);
window.fetch = (u, o) => { net.requests.push(String(u)); return _fetch(u, o); };

import { detectLang } from '../vendor/fold-chat/fold-chat-lang.js';
import { htmlReading, csvReading } from '../holodeck-read.js';
import { makeEngineRelationReader, loadPriors, blankMarkup, readDocument, pageLexicon } from '../holodeck-reader.js';
import { abbreviationsFor, priorsFor, isAbbreviationSurface } from '../vendor/khora/native/the-fold/read-core.mjs';
import { extractSurfacesHeard } from '../vendor/khora/native/the-fold/language-context.js';
import { extractReadings, sniffExtraction } from './extract.js';
import { joinItems, decideJunctions, applyJunctions } from './look-joins.js';
import { mountMap } from '../holodeck-map.js';
import { classifyWord, THRAX_MAP, THRAX_OUT_OF_SCOPE, THRAX_META, POS_PRIOR_META } from '../vendor/khora/native/adapters/text/wordclass.js';
import { morphologyFromPrior, createLemmatizer, stemsOf } from '../vendor/khora/native/adapters/text/morphology.js';
import { splitSentences } from '../vendor/khora/native/adapters/text/spans.js';
import { buildRows, sortRows, nextSort, tableHTML as refTableHTML } from './referent-table.js';
import { scanPunctuation, loadPunctuation, moodAt, containersAt, cuesFromBlankLines, cuesFromLayout } from './punctuation.js';
import { tokenize } from '../vendor/khora/native/organs/source.js';
import { loadModel as loadParser, analyse as parseRows, tokenize as parseTokens } from '../vendor/khora/native/adapters/text/english-parser.js';
import { tuplesOf } from './propositions.js';
import { classifyForm, lookupForm, documentClassifier } from '../holodeck-surface.js';
import { namesCorefer, genericTokens, extractSurfaces, discoverReferents, diaNorm } from '../vendor/khora/native/adapters/text/surfaces.js';
import { sha256 } from '../vendor/khora/native/kernel/sha256.js';
import { resolvePronouns } from '../vendor/khora/native/adapters/text/pronouns.js';
import { buildReadingTimeline, foldLog, CELLS } from '../vendor/khora/native/adapters/text/reading-timeline.js';
import { makeLookup } from '../holodeck-lookup.js';
import { startOffline } from './offline.js';
import { mountSources } from './corpus.js';
import { mountReader } from './reader-view.js';
import { makeSameBeing } from '../vendor/khora/native/adapters/text/corpus-identity.js';
import { browserOcr, loadPdfjs } from '../holodeck-ocr.js';
import { recordOcr } from './scan-ledger.js';
import { sha256Hex, stableProvenanceId, byteRange, EotLedger } from '../vendor/fold-chat/fold-chat-eot.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const enc = new TextEncoder();
const utf8Len = (s) => enc.encode(String(s)).length;
const charToByte = (text, i) => utf8Len(text.slice(0, i));
const clamp = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n) + '…' : s; };
const hx = (v, n) => String(v == null ? '' : v).slice(0, n == null ? 20 : n);
const ms = t => t < 1 ? t.toFixed(3) : t < 100 ? t.toFixed(2) : t < 10000 ? t.toFixed(1) : Math.round(t).toLocaleString();
const cap = s => { s = String(s || ''); return s ? s[0].toUpperCase() + s.slice(1) : s; };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';

const SAMPLES = {
  positions: `The Palestinian Authority condemned the raid on Monday. Israel said the strike had targeted a commander. Human Rights Watch criticized the decision, while the mayor endorsed it. The council opposed the measure but the governor supported it, and two senators praised the compromise.`,
  dossier: `Marie Curie praised the method, and the Royal Society endorsed the finding. Darwin opposed the standard, and Wallace supported the appeal. Human Rights Watch criticized the decision, and the mayor endorsed it. The Palestinian Authority condemned the raid, and Israel defended the strike.`,
  history: `Napoleon opposed the treaty, and Wellington supported it. Lincoln condemned the raid, and Grant endorsed the plan. The Senate opposed the measure, and the President supported it. Caesar criticized the senate, and Pompey praised the crowd.`,
};

// ── THE PIPELINE: the layers, in the order the reading really makes them. ─────
// `feature` names the reader option a switch controls; `fixed` layers always run.
const LAYERS = [
  { id:'extract',   label:'Extract',    color:'--date',  fixed:true, why:'the container (PDF / HTML) → text, sniffed; the platform converter is called when the sniff says so' },
  { id:'bytes',     label:'Bytes',      color:'--dim',   fixed:true, why:'the material as bytes — one addressable source' },
  { id:'decode',    label:'Decode',     color:'--pink',  fixed:true, why:'utf-8 bytes → characters; the address space stays bytes' },
  { id:'furniture', label:'Furniture',  color:'--mut',   feature:'furniture', why:'markup / CSS / URLs blanked in place — offsets untouched' },
  { id:'punct',     label:'Punctuation', color:'--amber', fixed:true, why:'every mark kept, with its role: sentence ends and their mood, quotations, brackets, separators' },
  { id:'lexicon',   label:'Hyperlexicon', color:'--acc2', feature:'lexicon', why:'forms the priors cannot settle, asked of the hyperlexicon (its local giver, English Wiktionary): an alias keeps its period, a missing class is filled' },
  { id:'statement', label:'Statements', color:'--ink2',  fixed:true, why:'the material split into the statements it makes' },
  { id:'token',     label:'Words',      color:'--blue',  fixed:true, why:'each statement split into the forms it is made of' },
  { id:'grammar',   label:'POS',        color:'--acc',   feature:'pos', why:'each form → the classes it is ATTESTED as (Thrax over UD)' },
  { id:'morph',     label:'Morphology', color:'--amber', feature:'morph', why:'each form → the act it belongs to (UniMorph prior ∪ rule)' },
  { id:'stance',    label:'Stance',     color:'--pink',  feature:'stance', why:'a position read as its class ("is pro" = a source\'s "in support of")' },
  { id:'referent',  label:'Referents',  color:'--acc2',  fixed:true, why:'the participants this material establishes, by name' },
  { id:'relation',  label:'Relations',  color:'--green', fixed:true, why:'subject —act→ object, bound clause-aware, with a verdict' },
  { id:'np',        label:'Noun-phrase subjects', color:'--dim', fixed:true, why:'a subject read as a noun phrase, not just the token before the verb' },
  { id:'phrasal',   label:'Phrasal predicates',   color:'--dim', fixed:true, why:'a verb + particle read as one act ("gave up")' },
  { id:'render',    label:'Render',     color:'--blue',  fixed:true, why:'the triple → a reader\'s word order (English SVO · SOV · VSO)' },
  { id:'ledger',    label:'EOT',        color:'--green', fixed:true, why:'every step appended as a transform, with a recomputable id' },
];
const L = {}; LAYERS.forEach((l, i) => L[l.id] = { i, ...l });
const CK = {}; LAYERS.forEach((l, i) => CK[l.id] = i);
const FEATURE_OF = {}; LAYERS.forEach(l => { if (l.feature) FEATURE_OF[l.feature] = l.id; });
const OPTIONAL = LAYERS.filter(l => l.feature).map(l => l.feature);
const DEFAULT_FEATURES = { furniture:true, lexicon:true, pos:true, morph:true, stance:true, npSubj:true, phrasal:true };

// the stance class, re-declared here (same shape as the organ) so the page can
// COUNT and LABEL the positions the stance layer carried, never to change them.
const STANCE_CLASS = [
  ['support', /\b(?:supports?|supported|supporting|support(?:ive)?|backs?|backed|backing|endors(?:e|es|ed|ing)|favou?rs?|favou?red|favou?ring|champions?|championed|advocat(?:e|es|ed|ing)|defends?|defended|prais(?:e|es|ed|ing)|pro|solidarity|ally)\b/i],
  ['oppose', /\b(?:oppos(?:e|es|ed|ing)|against|anti|condemn(?:s|ed|ing)?|criticiz(?:e|es|ed|ing)|criticis(?:e|es|ed|ing)|denounc(?:e|es|ed|ing)|boycott(?:s|ed|ing)?|resist(?:s|ed|ing)?|protest(?:s|ed|ing)?)\b/i],
];
const stanceClass = label => { const t = String(label || ''); for (const [k, re] of STANCE_CLASS) if (re.test(t)) return k; return null; };

// ── the polytemporality rule (declared on this page, same shape as the organ) ─
const MODAL_FUT = /\b(will|shall|'ll)\b/i;
const HAD_PART = /\bhad\s+\w+(ed|en|wn|ne|de|ad|it)\b/i;
function localTense(t){
  t = String(t || '');
  if (HAD_PART.test(t)) return { v:'Pqp', why:'had + participle — a past before a past' };
  if (MODAL_FUT.test(t)) return { v:'Fut', why:'modal will/shall — analytic future' };
  if (/\b(is|are|am|has|have)\b/i.test(t)) return { v:'Pres', why:'finite present (be/have)' };

// ═════════════════════════════════════════════════════════════════════════════
//  READ → BUILD TRACE → OPEN
// ═════════════════════════════════════════════════════════════════════════════
function mapClaims(raw, analysis){
  return (raw || []).map(c => {
    const sp = (c.spans || [])[0] || {};
    const hasSpan = sp.text != null && sp.text !== '';
    const at = hasSpan ? analysis.indexOf(sp.text) : -1;
    const s = at >= 0 ? at : (sp.start ?? 0);
    const e = s + (hasSpan ? sp.text.length : 0);
    const polarityMeasured = !(sp.text && /^(not|no|never|n't)\b/i.test(String(sp.text).trim()));
    return { end1:c.end1, end2:c.end2, label:c.label, polarity:c.polarity || '+', verdict:c.verdict || 'bound',
      reason:c.reason || '', grammar:c.grammar || null, formBased:!!c.formBased,
      fillers:(c.cardinality && c.cardinality.fillers && c.cardinality.fillers.length) || 0,
      standing:(c.assertion && c.assertion.standing) || 'single-witness',
      contested:!!c.contested, corroboration:c.corroboration || null,
      span:sp.text || '', s, e, grounded:at >= 0, hasSpan, located:hasSpan, polarityMeasured,
      b0:hasSpan ? charToByte(analysis, s) : null, b1:hasSpan ? charToByte(analysis, e) : null,
      tense:hasSpan ? localTense(sp.text) : { v:'unlocated', why:'the claim carried no span — nothing to place' } };
  }).sort((a, b) => a.s - b.s || a.b0 - b.b0);
}


// the reading over time: replay the text sentence by sentence, after the first paint (it re-reads each prefix)
function startTimeline(T){
  setTimeout(() => {
    try {
      const pos = T.feat.pos === false ? null : PRIORS.posPrior, R = T.R;
      const memo = new Map();   // one classification cache for every prefix of this replay
      // the replay reads each prefix with the master's own organs: its cut (this read's abbreviations), its surfaces (the heard tier
      // included), its pronoun resolver, and the very reader the master read the whole text with
      T.timeline = buildReadingTimeline(T.clean, {
        hash: sha256, diaNorm, splitSentences: (t, o = {}) => splitSentences(t, { ...o, abbreviations: o.abbreviations ?? T.abbreviations }), wordsIn, extractSurfaces: (x, o) => extractSurfacesHeard(x, o).filter(sf => !isAbbreviationSurface(sf.surface, T.abbreviations)), discoverReferents, resolvePronouns,
        classifyAt: prefix => pos ? documentClassifier(prefix, { posPrior: pos, lemmatizer: PRIORS.lemmatizer, lookups: T.feat.lexicon === false ? null : LOOKUP.cache, memo }) : (f => classifyForm(f, { posPrior: null })),
        readClaims: prefix => mapClaims(R([{ ref:'source', text:prefix }]).read(prefix).claims, prefix),
      }, { maxSnapshots: 40 });
    } catch (err) { console.error(err); T.timeline = { schema:'EOReadingTimeline@1', sentences:[], words:[], snapshots:[], revisions:[], error:String(err && err.message || err) }; }
    if (T.onTimeline) T.onTimeline();

}

// THE CLASS FILL: a word form the class prior cannot place is asked of the same hyperlexicon the master pipeline asks (the page's
// local giver, no network); what it lists is a witness the replay's classifier reads (LOOKUP's cache). English only: the page's
// dictionary parser reads English entries.
async function classFill(clean, feat){
  const lang = PRIORS.lang && PRIORS.lang.confident && PRIORS.lang.lang ? PRIORS.lang.lang : 'en', pos = PRIORS.posPrior;
  if (feat.lexicon === false || !pos || lang !== 'en') return { asked:0, found:[] };
  const gap = new Set();
  for (const w of new Set(clean.match(/\p{L}[\p{L}'’-]*\p{L}/gu) || [])){
    if (w.length < 3) continue;
    let c = null; try { c = classifyForm(w, { posPrior: pos, lemmatizer: PRIORS.lemmatizer }); } catch (e) {}
    if (!c || !c.found) gap.add(w);
  }
  await HLEX.want(new Set([...gap, ...[...gap].map(w => w.toLowerCase())]));
  const found = [];
  for (const w of gap){
    if (!HLEX.get(w) && !HLEX.get(w.toLowerCase())) continue;
    const rec = await LOOKUP.look(w, { only:['dictionary'], network:false });
    if (rec && rec.dictionary && rec.dictionary.found) found.push({ form:w, upos:rec.dictionary.upos || [] });
  }
  return { asked:gap.size, found };
}

async function read(text, label, feat, opt = {}){
  const raw = String(text || '');
  if (raw.trim().length < 8){ alert('Nothing to read yet — drop a document or paste text.'); return null; }
  await ready();
  lastRaw = raw; lastLabel = label || 'pasted text';
  const LIMIT = 80000;
  const analysis = raw.length > LIMIT ? raw.slice(0, LIMIT) : raw;
  const truncated = raw.length > LIMIT;
  const clean = feat.furniture === false ? analysis : blankMarkup(analysis);
  // a non-English document's relations are read against ITS language's prior (the suite's dispatch reader picks the extractor from it)
  // the rail's switches, under the names the reader takes (holodeck-reader.js reads posPrior · morphology · stance · nounPhraseSubjects · phrasalPredicates):
  // until now only `stance` reached it, so switching POS, morphology, noun-phrase subjects or phrasal predicates off re-ran the display and not the relations
  const readerFeatures = { posPrior: feat.pos !== false, morphology: feat.morph !== false, stance: feat.stance !== false, nounPhraseSubjects: feat.npSubj !== false, phrasalPredicates: feat.phrasal !== false };
  // THE MASTER PIPELINE: khora's read-core.mjs::readDocument (holodeck-reader.js hands it this page's priors, hyperlexicon giver
  // and organs). One read: the language, the cut, the cast, the relations, and the claims read back against the material.
  const foreign = PRIORS.posPrior !== PRIORS.posEng && PRIORS.langIso3 ? { iso3: PRIORS.langIso3, posPrior: PRIORS.posPrior } : null;
  const W = await readDocument(clean, { features: readerFeatures, foreign, lexicon: feat.lexicon === false ? null : undefined, address: lastLabel });
  ABBR_NOW = new Set([...(W.abbreviationSet || [])].map(a => String(a).toLowerCase()));
  const claims = mapClaims(W.claims || [], analysis);
  const doc = { label: lastLabel, analysis, truncated, layout: opt.layout || (opt.keep && opt.keep.layout) || null };
  const T = traceOf(doc, clean, W, claims, feat, opt.extraction || null);
  T.clean = clean; T.R = W.reader; T.feat = feat; T.lexicon = W.aliasReport; T.abbreviations = W.abbreviationSet;
  T.classFill = await classFill(clean, feat);
  // a proposition is held in the MOOD of its sentence (a question asks; it does not assert) and NESTED in the containers around it (speech, aside), in order
  T.claims.forEach(c => { if (c.located){ c.mood = moodAt(T.punctuation, c.s); c.holds = containersAt(T.punctuation, c.s).map(k => ({ kind:k.kind, mark:k.mark, mood:k.mood })); } });
  startTimeline(T);
  $('model').textContent = `model calls: ${T.net.models}`;
  if (opt.animate !== false){ openTrace(T); }
  else if (opt.keep || cur){ openReader(T, opt.keep || null); }
  return T;
}

// ── WHAT KIND OF BYTES ARE THESE? A binary file decoded as text is mojibake,
// never a reading. Sniff the magic, read a PDF's own text layer with pdf.js,
// and refuse anything that is not text with a typed gap — never a guess.
function sniff(buf){
  const ascii = (o, s) => { for (let i = 0; i < s.length; i++) if (buf[o + i] !== s.charCodeAt(i)) return false; return true; };
  if (buf.length >= 4 && ascii(0, '%PDF')) return 'pdf';
  if (buf.length >= 4 && buf[0] === 0x89 && buf[1] === 0x50 && buf[2] === 0x4e && buf[3] === 0x47) return 'image';
  if (buf.length >= 3 && buf[0] === 0xff && buf[1] === 0xd8 && buf[2] === 0xff) return 'image';
  if (buf.length >= 4 && ascii(0, 'GIF8')) return 'image';
  if (buf.length >= 12 && ascii(0, 'RIFF') && ascii(8, 'WEBP')) return 'image';
  if (buf.length >= 2 && buf[0] === 0x42 && buf[1] === 0x4d) return 'image';
  if (buf.length >= 12 && ascii(0, 'RIFF') && ascii(8, 'WAVE')) return 'audio';
  if (buf.length >= 4 && (ascii(0, 'ID3') || ascii(0, 'OggS') || ascii(0, 'fLaC'))) return 'audio';
  if (buf.length >= 2 && buf[0] === 0xff && (buf[1] & 0xe0) === 0xe0) return 'audio';
  if (buf.length >= 8 && ascii(4, 'ftyp')) return 'video';
  if (buf.length >= 2 && buf[0] === 0x50 && buf[1] === 0x4b) return 'archive';
  const n = Math.min(buf.length, 4096); let nul = 0, ctrl = 0;
  for (let i = 0; i < n; i++){ const c = buf[i]; if (c === 0) nul++; else if (c < 9 || (c > 13 && c < 32)) ctrl++; }
  if (nul > 0 || ctrl / Math.max(1, n) > 0.10) return 'binary';
  return 'text';
}
async function pdfText(buf){
  const m = await loadPdfjs();
  const pdf = await m.getDocument({ data: buf.slice() }).promise;
  const pages = Math.min(pdf.numPages, 40); let raw = ''; const startles = [];
  await ready();
  for (let i = 1; i <= pages; i++){
    const c = await (await pdf.getPage(i)).getTextContent();
    // words are joined by GEOMETRY, not by item (reading/look-joins.js): a space goes between two items only at a real word gap or a new line,
    // and a junction whose geometry contradicts itself (two baselines on one row) is marked as a STARTLE, for the later layers to settle
    const j = joinItems(c.items, { base: raw.length }); raw += j.text; startles.push(...j.startles.map((x) => ({ ...x, page: i })));
    raw += '\n\n';

}
// A STARTLE at a junction is settled by what the later layers can use: the lexicon, the document's own forms, and the names the referent
// layer has established (namesCorefer). Both readings stay on the record (reading.before is the PDF's own text); a decision can be flipped.
function junctionCtx(text){
  const counts = new Map(); for (const w of text.toLowerCase().match(/[\p{L}\p{N}'’-]+/gu) || []) counts.set(w, (counts.get(w) || 0) + 1);
  let names = []; try { names = extractSurfacesHeard(splitSentences(text, { abbreviations: abbreviationsFor(text, { priors: priorsFor('eng') }).set })).filter((x) => x.sentences >= 2).map((x) => x.surface); } catch (e) {}
  return { known: (w) => knownWord(w), docCount: (w) => counts.get(w) || 0, names, corefer: (a, b) => { try { return namesCorefer(a, b); } catch (e) { return false; } } };
}
function settleJunctions(E, startles, prior){
  const r = E.readings.find((x) => x.ok && /pdf\.js/.test(x.extractor)); if (!r) return;
  r.before = r.text; r.junctions = decideJunctions(r.text, startles, junctionCtx(r.text)); r.text = applyJunctions(r.before, r.junctions); r.sniff = sniffExtraction(r.text, { prior, floor: E.floor });
}
function refuse(name, kind, extra = {}){
  $('app').classList.remove('on');
  const M = {
    image:['an image', 'An image is pixels. Reading it needs OCR — tesseract, run by the fold’s dev server (node tools/serve.mjs), never a language model. This page was served without it (or the OCR found no words), so the reading names the gap.'],
    audio:['audio', 'The full holodeck transcribes audio in this browser (Whisper) and reads the transcript. This page reads text only.'],
    video:['a recording', 'The full holodeck reads a recording through its caption track or in-browser ASR. This page reads text only.'],
    archive:['an archive (zip / office file)', 'Not a single text document — there is nothing here to read as prose.'],
    binary:['binary', 'These bytes are not text. Decoding them as characters would only produce mojibake, so the reading names the gap rather than guessing.'],
    'pdf-no-text':['a scanned PDF with no text layer', 'Its pages are pixels. Reading them needs OCR — tesseract, run by the fold’s dev server (node tools/serve.mjs). This page was served without it (or the OCR found no words), so it refuses rather than invent.'],
    'pdf-failed':['a PDF whose text layer could not be read', 'pdf.js could not be loaded (offline?). The reading names the gap.'],
    'pdf-unreadable':['a PDF whose text does not read as words', 'The extraction did not read as words the prior holds, and no converter is available on this host. The reading names the gap rather than guessing — install poppler (pdftotext), or serve this page from the fold’s dev server, which converts with it.'],
  }[kind] || ['not text', '—'];

// the platform's own converter, when the page is served by the fold's dev server (tools/serve.mjs):
// pdftotext/textutil reconstruct WORDS from the page's glyph advances — the wheel, not reinvented.
async function convert(buf){
  try {
    const r = await fetch('/convert', { method: 'POST', body: buf });
    if (!r.ok) return null;
    const text = await r.text();
    return { text, converter: r.headers.get('X-Converter') || 'converter' };
  } catch (e) { return null; }
}
let OCR_META = null;
// no server recogniser (a static host, or offline): tesseract.js runs in this browser from files the service worker keeps
async function ocrInBrowser(buf, show){
  try {
    const kind = sniff(buf) === 'pdf' ? 'pdf' : 'image';
    show('<b>Reading pixels</b> — tesseract.js (OCR, no model) · in this browser · starting');
    const r = await browserOcr(buf, kind, {
      onStatus: st => show(`<b>Reading pixels</b> — tesseract.js (OCR, no model) · in this browser · ${esc(st)}`),
      onPage: p => { if (p.text.trim()) ta.value = (ta.value ? ta.value + '\n\n' : '') + p.text.trim(); show(`<b>Reading pixels</b> — tesseract.js (OCR, no model) · in this browser · page ${p.n} of ${p.total}${p.conf != null ? ` · ${p.conf}% mean word confidence` : ''}`); },
    });
    OCR_META = { pages: r.pages, total: r.total, words: r.words, conf: r.conf, where: 'browser', layout: r.layout };
    $('refuse').hidden = true;
    return r.text;
  } catch (e) { show(`<b>In-browser OCR failed</b> <span class="mono">${esc(e && e.message || e)}</span> — the engine files may not be saved yet (see the offline chip).`); return null; }

// read PIXELS with the platform's own recogniser (tesseract, via the dev server's POST /ocr) — never a model.
// The server streams one JSON line per page; the text arrives in the box as each page is read, with the
// engine's own mean word confidence, so the reading can be watched before the layers animate.
async function ocr(buf){
  const note = $('refuse');
  const show = h => { note.hidden = false; note.innerHTML = h; };
  let r;
  try { r = await fetch('/ocr', { method: 'POST', body: buf }); } catch (e) { r = null; }
  if (!r || !r.ok || !r.body) return await ocrInBrowser(buf, show);
  const rd = r.body.getReader(), dec = new TextDecoder();
  let pending = '', text = '', pages = 0, total = 0, words = 0, confSum = 0, engine = 'tesseract';
  for (;;){
    const { done, value } = await rd.read(); if (done) break;
    pending += dec.decode(value, { stream: true });
    let nl;
    while ((nl = pending.indexOf('\n')) >= 0){
      const l = pending.slice(0, nl); pending = pending.slice(nl + 1);
      if (!l.trim()) continue;
      let m; try { m = JSON.parse(l); } catch (e) { continue; }
      if (m.event === 'start'){ total = m.total; engine = m.engine ? m.engine.replace(/\+/g, ' + ') : engine; show(`<b>Reading pixels</b> — ${engine} (OCR, no model) · page 0 of ${total}${m.pages > m.total ? ` (first ${m.total} of ${m.pages})` : ''}`); }
      else if (m.event === 'page'){
        pages++;
        if (m.text){ text += (text ? '\n\n' : '') + m.text; ta.value = text; }
        if (m.conf != null){ words += m.words; confSum += m.conf * m.words; }
        show(`<b>Reading pixels</b> — ${engine} (OCR, no model) · page ${pages} of ${total}${m.conf != null ? ` · ${m.conf}% mean word confidence` : ''}${m.error ? ` · <span class="mono">${esc(m.error)}</span>` : ''}`);
      }
    }
  }

  note.hidden = true;
  return text;
}
async function readFile(file){
  const d = $('refuse'); if (d) d.hidden = true;
  const buf = new Uint8Array(await file.arrayBuffer());
  const kind = sniff(buf);

  const isHtml = /^\s*<(?:!doctype html|html|\?xml)/i.test(head);
  if (kind !== 'pdf' && kind !== 'text' && kind !== 'image') return refuse(file.name, kind);
  await ready();
  const prior = { name: 'English vocabulary', giver: (PRIORS.posPrior && PRIORS.posPrior.provenance && PRIORS.posPrior.provenance.source) || 'UD/Thrax + UniMorph', known: knownWord, longest: LEXICON_LONGEST };
  let E = null, PDF_STARTLES = null;
  OCR_META = null;
  const ocrReading = { name: 'tesseract OCR (this machine)', run: async () => ocr(buf) };
  if (kind === 'image'){
    // pixels only: the one reading is the recogniser's
    E = await extractReadings({ prior, extractors: [ocrReading] });
  } else if (kind === 'pdf'){
    // parallel readings (eigenvalues): pdf.js (local) and the platform converter; one collapses as the reading.
    // If neither reads as words (a scan: its pages are pixels), the recogniser joins them and the gate chooses.
    const textual = [
      { name: 'pdf.js text layer (browser)', run: async () => { const p = await pdfText(buf); PDF_STARTLES = p.startles; return p.raw; } },
      { name: 'pdftotext (poppler)', run: async () => { const c = await convert(buf); return c && c.text; } },
    ];
    E = await extractReadings({ prior, extractors: textual });
    const c0 = E.collapsed != null ? E.readings[E.collapsed] : null;
    if (!c0 || !c0.text || c0.text.trim().length < 8 || c0.sniff.verdict === 'unconfirmed') E = await extractReadings({ prior, extractors: [...textual, ocrReading] });
  } else if (isHtml){
    E = await extractReadings({ prior, extractors: [
      { name: 'textutil (macOS)', run: async () => { const c = await convert(buf); return c && c.text; } },
      { name: 'the browser’s own parse (readable text, markup dropped)', run: async () => { const d = new DOMParser().parseFromString(htmlReading(new TextDecoder().decode(buf)).html, 'text/html'); return [...d.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,pre,blockquote,td,th')].filter((e) => !e.querySelector('p,li,pre,blockquote')).map((e) => e.textContent.trim()).filter(Boolean).join('\n'); } },
    ] });
  } else {
    const raw = new TextDecoder().decode(buf);
    // a delimited table: each row is read as a statement about its first cell, the way its columns name it
    if (/\.(csv|tsv)$/i.test(file.name)) { const c = csvReading(raw, file.name); if (c.statements) return run(c.statements, file.name); }

  if (chosen.sniff.verdict === 'unconfirmed') return refuse(file.name, 'pdf-unreadable', { reads: chosen.sniff.reads });
  const viaOcr = OCR_META && /tesseract/.test(chosen.extractor);
  return run(chosen.text, file.name + (viaOcr ? ` — ${chosen.extractor} · ${OCR_META.pages} page${OCR_META.pages === 1 ? '' : 's'}, ${OCR_META.conf}% mean word confidence` : ''), { extraction: E, layout: viaOcr && OCR_META.layout && OCR_META.layout.pages.length ? OCR_META.layout : null });
}

// several sources, one log (reading/corpus.js): the page supplies the priors and the verb test, the organ owns none
async function corpusDeps(){
  await ready();
  const pos = PRIORS.posPrior, memo = new Map();
  const isVerb = w => { const c = classifyForm(String(w).toLowerCase(), { posPrior: pos, lemmatizer: PRIORS.lemmatizer }); return !!(c.found && c.candidates && c.candidates[0] && c.candidates[0].upos === 'VERB'); };
  return { hash: sha256, diaNorm, splitSentences, wordsIn, extractSurfaces, discoverReferents, resolvePronouns, namesCorefer, genericTokens, isVerb, sameBeing: makeSameBeing(),
    classifyAt: prefix => documentClassifier(prefix, { posPrior: pos, lemmatizer: PRIORS.lemmatizer, lookups: LOOKUP.cache, memo }) };
}
const SOURCES = mountSources($('sources'), { makeDeps: corpusDeps, openInReader: (t, l) => { ta.value = t; run(t, l); }, currentText: () => ta.value });
$('addsrc').addEventListener('click', () => SOURCES.addCurrent());
$('exsrc').addEventListener('click', () => SOURCES.example());

window.__demo = { offline: OFFLINE, sources: SOURCES, view: () => cur, read, run, wholeDocument, lookup: LOOKUP, json:() => (cur ? readingJSON(cur.T) : null), text:() => (cur ? diagrammedText(cur.T) : null), current:() => (cur ? cur.T : null), features:() => features, net };
</script>
