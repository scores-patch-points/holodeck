<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to read without a model — the pipeline, layer by layer</title>
<style>
  :root{--bg:#17171a;--s1:#1c1c20;--s2:#29292e;--sel:#26272c;--sel2:#30333b;--line:#2e2e33;--line2:#3f3f46;--ink:#f4f4f6;--ink2:#c9c9d2;--mut:#9d9da8;--dim:#9494a0;--acc:#8ab4ff;--acc2:#8ab4ff;--acc3:#6d9dff;--amber:#f0b429;--blue:#8ab4ff;--green:#56d364;--pink:#e0a0c0;--date:#8ab4ff;--ok:#56d364;--bad:#f87171;--edge:#3f3f46;--hdr:rgba(23,23,26,.95);--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;--serif:Georgia,"Times New Roman",serif;color-scheme:dark}
  :root{--f0:#9494a0;--f1:#c68bff;--f2:#56d364;--f3:#8ab4ff;--f4:#e0a0c0;--f5:#f0b429;--f6:#ff9d6e}  /* the floors, F0 units … F6 premises (reading/mhc-ladder.js) */
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
  a{color:var(--acc)}
  button{font:inherit}
  /* ── landing ───────────────────────────────────────────────────────────── */
  header{padding:30px 28px 16px;border-bottom:1px solid var(--line);position:relative}
  header h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em;font-family:var(--serif);font-weight:500}
  header .sub{color:var(--dim);max-width:960px;font-size:14px}
  header .sub b{color:var(--ink);font-weight:600}
  .wrap{max-width:1120px;margin:0 auto;padding:0 28px 80px}
  .drop{margin:20px 0;border:1.5px dashed var(--line2);border-radius:14px;background:var(--s1);padding:24px;text-align:center;transition:.15s;cursor:pointer}
  .drop.hot{border-color:var(--acc);background:#1a1d26}
  .drop .big{font-size:16px;font-weight:600}.drop .small{color:var(--dim);font-size:13px;margin-top:5px}
  textarea{width:100%;min-height:130px;background:var(--s1);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px;font:13px/1.5 var(--mono);resize:vertical;margin-top:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .row button{background:var(--s1);color:var(--ink);border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font:13px var(--sans);cursor:pointer}
  .row button:hover{border-color:var(--acc);color:var(--acc)}
  .row button.primary{background:#1c2740;border-color:#33507f}
  .samples button{padding:5px 10px;font-size:12.5px}
  .badge{font:12.5px var(--mono);padding:1px 7px;border-radius:6px;background:#1a2130;color:var(--dim);border:1px solid var(--line)}
  .badge.live{color:var(--green);border-color:#245a41}
  .legend-note{color:var(--dim);font-size:12.5px;margin-top:6px}
  .legend-note b{color:var(--ink)}
  .refuse{margin:12px 0;border:1px solid #5c2530;border-radius:12px;background:#201418;color:#f0c9cf;padding:12px 14px;font-size:13.5px}
  .refuse b{color:#fff}
  .refuse[hidden]{display:none}
  /* ── the app ───────────────────────────────────────────────────────────── */
  #app{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;grid-template-rows:auto 1fr auto;font:14px/1.45 var(--sans)}
  #app.on{display:grid}
  .top{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--line)}
  .top h2{margin:0;font:500 19px/1.2 var(--serif);text-wrap:balance}
  .top .meta{font:12.5px var(--mono);color:var(--dim)}
  .top .sp{flex:1}
  .top button{all:unset;cursor:pointer;color:var(--mut);font:500 13px var(--sans);padding:4px 6px;border-radius:4px}
  .top button:hover{color:var(--ink)}
  .top button.f{font-weight:600}
  .top button.f[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc);border-radius:0}
  .top .exit{border:1px solid var(--line2)!important;border-radius:6px;padding:5px 11px!important;color:var(--ink)!important;font-weight:600}
  .top .stats{flex-basis:100%;font:12.5px var(--mono);color:var(--ink2);display:flex;gap:10px 16px;flex-wrap:wrap;padding-top:6px}
  .top .stats b{color:var(--ink);font-weight:600}.top .stats .g{color:var(--dim)}
  /* ── spine: the pipeline, with layer switches ──────────────────────────── */
  .spine{overflow-y:auto;border-bottom:1px solid var(--line);padding:8px 10px 10px}
  .spine .h{font:600 12.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:6px 4px 8px}
  .ly{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;margin:3px 0;padding:5px 9px;background:var(--s1);cursor:pointer}
  .ly:hover{border-color:var(--line2)}.ly:focus-visible{outline:2px solid var(--acc3);outline-offset:1px}
  .ly .n{font:600 12.5px var(--mono);color:var(--bg);background:var(--dim);border-radius:5px;padding:1px 6px;text-align:center}
  .ly.on{border-color:var(--acc3);background:#1a1f2b}
  .ly.on .n{background:var(--acc);color:#0b0d12}
  .ly.off{opacity:.55}
  .ly .lab{font-weight:600;font-size:13px}
  .ly .why{color:var(--dim);font-size:12.5px;grid-column:2 / 4;margin-top:-2px}
  .ly .cnt{font:12.5px var(--mono);color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sw{position:relative;width:36px;height:20px;border-radius:20px;background:#33333a;border:1px solid var(--line2);cursor:pointer;flex:none}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:.14s}
  .sw[aria-checked=true]{background:#1e3a2b;border-color:#2f6b4b}
  .sw[aria-checked=true]::after{left:18px;background:var(--green)}
  .sw[aria-disabled=true]{opacity:.4;cursor:not-allowed}
  .ly.cur .lab{color:var(--ink)}
  .ly.cur{box-shadow:inset 3px 0 0 var(--acc)}
  /* ── the floors in the rail: a header per floor whose verdict fills in as the replay reaches it; under each, the layers that make its operand ── */
  .fh{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:5px 6px;align-items:center;margin:14px 0 4px;padding:3px 2px 5px;border-bottom:1px solid var(--line);cursor:pointer}
  .spine .h + .fh{margin-top:2px}
  .fh .f{font:600 12px var(--mono);color:var(--bg);background:var(--fc);border-radius:5px;padding:1px 7px}
  .fh .t{min-width:0;line-height:1.3}.fh .nm{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);overflow-wrap:anywhere}
  .fh .vd{font:12px var(--mono);color:var(--dim);justify-self:end;text-align:right;white-space:nowrap;line-height:1.3}
  .fh .vd.ok{color:var(--green)}.fh .vd.bad{color:var(--amber)}.fh .vd.fail{color:var(--bad)}
  .fh .no{font:11.5px var(--mono);color:var(--dim);margin-left:6px}
  .fh .rv{font:11px var(--mono);color:var(--pink);margin-left:6px}
  .fh .car{background:none;border:0;color:var(--dim);cursor:pointer;font-size:12px;padding:0 2px;min-width:22px;min-height:22px;border-radius:4px}.fh .car:hover{color:var(--ink);background:var(--s1)}
  .fh.closed{margin-bottom:2px}
  .fh.ahead .f{opacity:.55}
  .fh.stage .nm::after{content:" · stage";color:var(--green);text-transform:none;letter-spacing:0}
  .fh.cur{box-shadow:inset 3px 0 0 var(--fc)}
  .fh:hover .nm,.fh:focus-visible .nm{color:var(--ink)}
  /* ── event log ─────────────────────────────────────────────────────────── */
  .log{display:grid;grid-template-rows:1fr auto;min-height:0}
  .rows{overflow-y:auto;position:relative;font:12.5px/24px var(--mono);min-height:0}
  .sz{position:relative}
  .row-ev{position:absolute;left:0;right:0;height:24px;display:grid;grid-template-columns:70px 88px 1fr;gap:8px;padding:0 12px;white-space:nowrap;cursor:pointer;color:var(--ink2)}
  .row-ev span{overflow:hidden;text-overflow:ellipsis}
  .row-ev .t{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
  .row-ev .st{font-weight:500}
  .row-ev:hover{background:var(--s1)}.row-ev.cur{background:var(--sel2);color:var(--ink)}
  .row-ev.fut{opacity:.28}
  .now{border-top:1px solid var(--line);padding:8px 14px 10px;min-height:74px}
  .now .k{font:600 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .now p{margin:4px 0 0;font-size:14px;color:var(--ink);max-width:74ch}
  /* ── right: lens + tabs ────────────────────────────────────────────────── */
  .lens{border-bottom:1px solid var(--line);padding:4px 18px 12px;max-height:24vh;overflow:auto}
  .lens .doc{font:12.5px var(--mono);color:var(--dim);margin-bottom:4px;padding-top:8px}
  .lens .txt{font:15px/1.7 var(--serif);color:var(--mut);white-space:pre-wrap;max-width:92ch;word-break:break-word}
  .lens .txt .s{color:var(--ink2)}.lens .txt .on{color:var(--ink);background:var(--sel)}
  .lens .txt .nm{box-shadow:inset 0 -2px 0 var(--acc)}.lens .txt .g{box-shadow:inset 0 -2px 0 var(--blue)}
  .lens .txt .m{box-shadow:inset 0 -2px 0 var(--amber)}.lens .txt .r{box-shadow:inset 0 -3px 0 var(--green)}
  .lens .txt .fu{text-decoration:line-through;opacity:.42}.lens .txt .hit{outline:2px solid var(--acc);border-radius:2px}
  .tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{all:unset;cursor:pointer;font:600 12.5px var(--sans);color:var(--dim);padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
  .pane{overflow:auto;min-height:0;padding:12px 16px 24px}
  .pane-wrap{min-height:0;display:grid;position:relative}
  .pane-wrap > *{grid-area:1/1}
  .graph-host{padding:0;overflow:hidden;position:relative}
  .graph-host[hidden]{display:none}
  .pane .h{font:600 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:12px 0 6px}
  .fig{border:1px solid var(--line);border-radius:9px;background:var(--s1);padding:9px 11px;margin:8px 0;font-size:12.5px;color:var(--ink2)}
  .fig b{color:var(--ink)}
  /* source pane */
  .src{font:13px/1.7 var(--mono);color:var(--ink2);white-space:pre-wrap;word-break:break-word}
  .src .s{color:var(--ink2)}.src .nm{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
  .src .r{background:#15211a;box-shadow:inset 3px 0 0 var(--green)}
  .src .fu{color:#5b5b66;text-decoration:line-through}
  .src .hit{outline:2px solid var(--acc);border-radius:2px}
  /* tables */
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t th{position:sticky;top:0;background:var(--bg);color:var(--dim);font:600 12.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;z-index:2}
  table.t tr.cur{background:#20242e;box-shadow:inset 3px 0 0 var(--acc)}
  table.t th[data-sort]{cursor:pointer;user-select:none}
  table.t th[data-sort]:hover{color:var(--ink)}
  table.t td.n{color:var(--dim);font:12.5px var(--mono);text-align:right;width:34px}
  table.t td.stmt{font:14.5px/1.65 var(--serif);color:var(--ink2);max-width:44ch}
  table.t .mrel{border-bottom:1.5px solid var(--acc);color:var(--ink)}
  .noprop{color:var(--dim);font:12.5px var(--mono)}
  .mono{font-family:var(--mono);font-size:12.5px}
  .chip{display:inline-block;border:1px solid var(--line2);border-radius:20px;padding:0 8px;font:12.5px var(--mono);color:var(--dim);margin:2px 3px 2px 0}
  .chip.g{color:var(--green);border-color:#245a41}.chip.a{color:var(--amber);border-color:#5c4d1d}
  .chip.b{color:var(--blue);border-color:#234a6f}.chip.v{color:var(--bad);border-color:#5c2530}
  .gap{color:var(--bad)}
  .bar{display:inline-block;height:8px;background:#2b3a56;border-radius:3px;vertical-align:middle;min-width:2px}
  /* a drawn proposition */
  .prop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:2px 0;margin:1px 0}
  .pnode{border:1px solid var(--line2);border-radius:20px;padding:1px 10px;background:var(--s2);font:12.5px var(--sans);color:var(--ink);max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pnode.s{border-color:#33507f;background:#1a2130}.pnode.o{border-color:#245a41;background:#141f1a}
  .parc{display:inline-flex;align-items:center;gap:5px;color:var(--pink);font:12.5px var(--mono)}
  .parc .pline{width:30px;height:0;border-top:1.7px solid currentColor}
  .parc .phead{width:0;height:0;border-left:7px solid currentColor;border-top:4.5px solid transparent;border-bottom:4.5px solid transparent;margin-left:-6px}
  .parc.neg{color:var(--bad)}.parc.neg .pline{border-top-style:dashed}.parc.neg .plabel::before{content:'¬ '}
  .parc.far{color:var(--dim)}.parc.far .pline{border-top-style:dotted}
  /* confidence */
  .conf{display:inline-flex;align-items:center;gap:6px;font:12.5px var(--mono);color:var(--mut);cursor:help}
  .conf .cbar{width:52px;height:7px;border-radius:4px;background:#2a2a30;overflow:hidden}
  .conf .cbar i{display:block;height:100%;background:linear-gradient(90deg,#6b8f6a,#56d364)}
  .conf.mid .cbar i{background:linear-gradient(90deg,#8a7a3a,#f0b429)}
  .conf.low .cbar i{background:linear-gradient(90deg,#7a3a3a,#f87171)}
  /* render view */
  .ord{border:1px solid var(--line);border-radius:9px;background:var(--s1);padding:10px 12px;margin:10px 0}
  .ord h3{margin:0 0 2px;font:600 13px var(--sans)}.ord .giver{color:var(--dim);font:12.5px var(--mono);margin-bottom:8px}
  .ord .line{font:15px/1.7 var(--serif);color:var(--ink2);padding:2px 0;border-bottom:1px dotted #232936}
  .ord .line .lab{color:var(--pink)}.ord .line .neg{color:var(--bad)}
  /* EOT + JSON */
  pre.json{background:#0f131b;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:60vh;font:12.5px/1.5 var(--mono);color:#c7d2e2;margin:6px 0;white-space:pre}
  .evt{display:grid;grid-template-columns:auto auto 1fr;gap:3px 10px;padding:4px 0;border-bottom:1px solid var(--line);font:12.5px var(--mono)}
  .evt .id{color:var(--pink)}.evt .st{color:var(--amber)}.evt .rd{color:var(--dim)}
  /* transport */
  .ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctl button{background:none;border:0;color:var(--mut);font:500 13px var(--sans);cursor:pointer;padding:4px 6px;border-radius:4px}
  .ctl button:hover{color:var(--ink)}.ctl .pl{color:var(--acc);font-weight:600;min-width:64px}
  .ctl .rd{font:12.5px var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums;margin-left:auto}
  .ctl select{background:none;color:var(--mut);border:0;font:500 13px var(--sans);cursor:pointer}
  .ctl select option{background:var(--s1);color:var(--ink)}
  .seg{display:inline-flex;gap:2px;margin-left:8px}
  .seg button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc);border-radius:0}
  .key{font:12.5px var(--mono);color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
  .key i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .delta{margin:8px 0;border:1px solid #5c4d1d;border-radius:9px;background:#221d10;color:#f0d9a0;padding:8px 11px;font-size:13px}
  .delta b{color:#fff}

  /* ── wide screens: the lanes of the current sentence ── */
  .drawer,.dh{display:contents}
  .dt,.lanes,.insp{display:none}
  .lanes .col{display:inline-grid;justify-items:center;gap:2px;padding:4px 7px 5px;border-radius:7px;cursor:pointer;min-width:38px;border:1px solid transparent}
  .lanes .col:hover{background:var(--sel)}
  .lanes .col.cur{border-color:var(--acc);background:var(--sel)}
  .lanes .w{font:500 15px var(--serif);color:var(--ink)}
  .lanes .c{font:600 12.5px var(--mono);color:var(--blue);letter-spacing:.04em}
  .lanes .c.gap{color:#e57373}.lanes .c.inf{color:var(--amber)}.lanes .c.pend,.lanes .m.pend{color:var(--dim);opacity:.45}
  .lanes .m{font:12.5px var(--mono);color:var(--amber);max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lanes .h{font:600 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:0 2px 6px}
  .lanes .row{display:flex;flex-wrap:wrap;gap:2px 4px}
  .lanes .lg{font:12.5px var(--mono);color:var(--dim);padding-top:6px}
  .insp .ih{padding:12px 18px 8px;border-bottom:1px solid var(--line)}
  .insp .ih .k{font:600 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .insp .ih .ttl{font:500 22px/1.25 var(--serif);color:var(--ink);margin:4px 0 2px;word-break:break-word}
  .insp .ih .sub{font:12.5px var(--mono);color:var(--dim)}
  .insp .st{padding:10px 18px;border-bottom:1px solid var(--line)}
  .insp .st .n{font:600 12.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;gap:8px;align-items:center}
  .insp .st .n i{font-style:normal;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line2);color:var(--ink2);font-size:12.5px}
  .insp .st .v{margin-top:5px;font:13.5px/1.5 var(--sans);color:var(--ink)}
  .insp .st .v .mono{font:12.5px var(--mono)}
  .insp .st.ok .n i{background:var(--green);border-color:var(--green);color:#06210f}.insp .st.gap .n i{background:#e57373;border-color:#e57373;color:#2a0505}.insp .st.hop .n i{background:var(--amber);border-color:var(--amber);color:#2a1d02}
  .insp .bars{display:grid;gap:5px;margin-top:2px}
  .insp .bar{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center;font:12.5px var(--mono)}
  .insp .bar .tr{height:9px;border-radius:4px;background:var(--line);overflow:hidden}.insp .bar .tr b{display:block;height:100%;background:var(--blue)}
  .insp .why{font:12.5px/1.5 var(--sans);color:var(--dim);margin-top:4px}
  .insp .pill{display:inline-block;border:1px solid var(--line2);border-radius:99px;padding:0 8px;margin:0 4px 3px 0;font:12.5px var(--mono);color:var(--ink2)}
  .insp .rec{padding:10px 18px}.insp .rec .r{display:flex;gap:10px;font:12.5px/1.9 var(--mono);color:var(--ink2);cursor:pointer;border-radius:5px;padding:0 4px}.insp .rec .r:hover{background:var(--sel)}.insp .rec .r b{color:var(--ink);font-weight:500}.insp .rec .r span:first-child{color:var(--dim);min-width:42px}
  .insp .itabs{position:sticky;top:0;z-index:2;display:flex;gap:2px;padding:0 10px;background:var(--bg);border-bottom:1px solid var(--line)}
  .insp .itabs button{all:unset;cursor:pointer;font:600 12.5px var(--sans);color:var(--dim);padding:9px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
  .insp .itabs button:hover{color:var(--ink)}.insp .itabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
  .insp .rv .rh{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;font:600 12.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .insp .rv .rh .sp{flex:1}.insp .rv .rh button{all:unset;cursor:pointer;font:600 12.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--mut);padding:3px 8px;border:1px solid var(--line2);border-radius:5px}.insp .rv .rh button:hover{color:var(--ink)}
  .insp .rv pre{margin:0;padding:4px 16px 24px;font:12.5px/1.6 var(--mono);color:var(--ink2);overflow-x:auto;white-space:pre}
  .insp .rv pre.plain{font:15px/1.65 var(--serif);white-space:pre-wrap;color:var(--ink)}
  /* the Reading view: the whole text, always; the reading of it is what moves */
  .insp .rd{padding:0 0 28px}.insp .rd0{padding:18px;color:var(--dim);font:13px/1.6 var(--sans)}

<script type="module">
// ─────────────────────────────────────────────────────────────────────────────
// "No model was called" is MEASURED: every network request this page makes is
// counted, and the only ones that appear are the static prior files read from
// disk. The badge shows the count live.
// ─────────────────────────────────────────────────────────────────────────────
const net = { requests: [], models: 0 };
const _fetch = window.fetch.bind(window);
window.fetch = (u, o) => { net.requests.push(String(u)); return _fetch(u, o); };

import { detectLang } from '../vendor/fold-chat/fold-chat-lang.js';
import { htmlReading, csvReading } from '../holodeck-read.js';
import { makeEngineRelationReader, loadPriors, blankMarkup } from '../holodeck-reader.js';
import { extractReadings, sniffExtraction } from './extract.js';

import { classifyWord, THRAX_MAP, THRAX_OUT_OF_SCOPE, THRAX_META, POS_PRIOR_META } from '../vendor/khora/native/adapters/text/wordclass.js';
import { morphologyFromPrior, createLemmatizer, stemsOf } from '../vendor/khora/native/adapters/text/morphology.js';

import { scanPunctuation, loadPunctuation, moodAt, containersAt, cuesFromBlankLines, cuesFromLayout } from './punctuation.js';
import { tokenize } from '../vendor/khora/native/organs/source.js';
import { loadModel as loadParser, analyse as parseRows, tokenize as parseTokens } from '../vendor/khora/native/adapters/text/english-parser.js';
import { tuplesOf } from './propositions.js';
import { classifyForm, lookupForm, documentClassifier } from '../holodeck-surface.js';
import { namesCorefer, genericTokens, extractSurfaces, discoverReferents, diaNorm } from '../vendor/khora/native/adapters/text/surfaces.js';
import { sha256 } from '../vendor/khora/native/kernel/sha256.js';
import { resolvePronouns } from '../vendor/khora/native/adapters/text/pronouns.js';
import { buildReadingTimeline, foldLog, CELLS } from '../vendor/khora/native/adapters/text/reading-timeline.js';

import { mountReader } from './reader-view.js';

import { recordOcr } from './scan-ledger.js';
import { sha256Hex, stableProvenanceId, byteRange, EotLedger } from '../vendor/fold-chat/fold-chat-eot.js';
import { runLadder, runPriorArms, materialOf, FLOORS, PRIORS_OF, PRIOR_NOTE } from './mhc-ladder.js';
import { statusWord, cleanDetail, ARM_ROWS, armOutcome } from './floor-words.js';
import { orderOf } from '../vendor/khora/native/the-fold/mhc.js';
import { isClaimRef } from '../vendor/khora/native/organs/nesting.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const enc = new TextEncoder();
const utf8Len = (s) => enc.encode(String(s)).length;
const charToByte = (text, i) => utf8Len(text.slice(0, i));
const clamp = (s, n) => { s = String(s); return s.length > n ? s.slice(0, n) + '…' : s; };
const hx = (v, n) => String(v == null ? '' : v).slice(0, n == null ? 20 : n);
const ms = t => t < 1 ? t.toFixed(3) : t < 100 ? t.toFixed(2) : t < 10000 ? t.toFixed(1) : Math.round(t).toLocaleString();
const cap = s => { s = String(s || ''); return s ? s[0].toUpperCase() + s.slice(1) : s; };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888';

const SAMPLES = {
  positions: `The Palestinian Authority condemned the raid on Monday. Israel said the strike had targeted a commander. Human Rights Watch criticized the decision, while the mayor endorsed it. The council opposed the measure but the governor supported it, and two senators praised the compromise.`,
  dossier: `Marie Curie praised the method, and the Royal Society endorsed the finding. Darwin opposed the standard, and Wallace supported the appeal. Human Rights Watch criticized the decision, and the mayor endorsed it. The Palestinian Authority condemned the raid, and Israel defended the strike.`,
  history: `Napoleon opposed the treaty, and Wellington supported it. Lincoln condemned the raid, and Grant endorsed the plan. The Senate opposed the measure, and the President supported it. Caesar criticized the senate, and Pompey praised the crowd.`,
};

// ── THE PIPELINE: the layers, in the order the reading really makes them. ─────
// `feature` names the reader option a switch controls; `fixed` layers always run.
const LAYERS = [
  { id:'extract',   label:'Extract',    color:'--date',  fixed:true, why:'the container (PDF / HTML) → text, sniffed; the platform converter is called when the sniff says so' },
  { id:'bytes',     label:'Bytes',      color:'--dim',   fixed:true, why:'the material as bytes — one addressable source' },
  { id:'decode',    label:'Decode',     color:'--pink',  fixed:true, why:'utf-8 bytes → characters; the address space stays bytes' },
  { id:'furniture', label:'Furniture',  color:'--mut',   feature:'furniture', why:'markup / CSS / URLs blanked in place — offsets untouched' },
  { id:'punct',     label:'Punctuation', color:'--amber', fixed:true, why:'every mark kept, with its role: sentence ends and their mood, quotations, brackets, separators' },
  { id:'lexicon',   label:'Hyperlexicon', color:'--acc2', feature:'lexicon', why:'forms the priors cannot settle, asked of the hyperlexicon (its local giver, English Wiktionary): an alias keeps its period, a missing class is filled' },
  { id:'statement', label:'Statements', color:'--ink2',  fixed:true, why:'the material split into the statements it makes' },
  { id:'token',     label:'Words',      color:'--blue',  fixed:true, why:'each statement split into the forms it is made of' },
  { id:'grammar',   label:'POS',        color:'--acc',   feature:'pos', why:'each form → the classes it is ATTESTED as (Thrax over UD)' },
  { id:'morph',     label:'Morphology', color:'--amber', feature:'morph', why:'each form → the act it belongs to (UniMorph prior ∪ rule)' },
  { id:'stance',    label:'Stance',     color:'--pink',  feature:'stance', why:'a position read as its class ("is pro" = a source\'s "in support of")' },
  { id:'referent',  label:'Referents',  color:'--acc2',  fixed:true, why:'the participants this material establishes, by name' },
  { id:'relation',  label:'Relations',  color:'--green', fixed:true, why:'subject —act→ object, bound clause-aware, with a verdict' },
  { id:'np',        label:'Noun-phrase subjects', color:'--dim', fixed:true, why:'a subject read as a noun phrase, not just the token before the verb' },
  { id:'phrasal',   label:'Phrasal predicates',   color:'--dim', fixed:true, why:'a verb + particle read as one act ("gave up")' },
  { id:'render',    label:'Render',     color:'--blue',  fixed:true, why:'the triple → a reader\'s word order (English SVO · SOV · VSO)' },
  { id:'ledger',    label:'EOT',        color:'--green', fixed:true, why:'every step appended as a transform, with a recomputable id' },
];
const L = {}; LAYERS.forEach((l, i) => L[l.id] = { i, ...l });
const CK = {}; LAYERS.forEach((l, i) => CK[l.id] = i);
const FEATURE_OF = {}; LAYERS.forEach(l => { if (l.feature) FEATURE_OF[l.feature] = l.id; });
const OPTIONAL = LAYERS.filter(l => l.feature).map(l => l.feature);
const DEFAULT_FEATURES = { furniture:true, lexicon:true, pos:true, morph:true, stance:true, npSubj:true, phrasal:true };

// ── THE FLOORS over the pipeline: the fold's own ladder (reading/mhc-ladder.js), scored with the MHC's discipline. ──
// Each layer sits at the floor whose operand it makes. The layers that classify forms by a received prior (POS,
// morphology, stance) sit with F0: they say what a unit's forms carry and arrange nothing. Render re-orders an F2
// arrangement and makes no new operand. F3's judge is the verdict each relation carries, read in the Relations
// layer — no layer of its own. F4, F5 and F6 have no layer on this page, and the rail shows those rungs empty:
// that is the finding about this pipeline, not a gap in the drawing.
const FLOOR_OF_LAYER = { extract:'F0', bytes:'F0', decode:'F0', furniture:'F0', punct:'F0', lexicon:'F0', statement:'F0', token:'F0', grammar:'F0', morph:'F0', stance:'F0', referent:'F1', relation:'F2', np:'F2', phrasal:'F2', render:'F2', ledger:null };
const FLOOR_COLOR = { 'F0':'--f0', 'F1':'--f1', 'F2':'--f2', 'F3':'--f3', 'F4':'--f4', 'F5':'--f5', 'F6':'--f6' };
const FLOOR_NOTE = {   // what the rail says where a floor has no layer of its own
  'F3': 'no layer of its own — the verdict each relation carries (bound · contradicted · unbound), read back against the material',
  'F4': 'no layer on this page — nothing here puts a claim in an end slot',
  'F5': 'no layer on this page — the ladder reads notes across sources; this view reads one',
  'F6': 'no layer on this page — nothing here composes from premises',
};
const floorIdx = h => FLOORS.findIndex(f => f.floor === h);
// click a layer in the rail: the replay jumps to its first event and the drawer opens on the tab that shows its work
const TAB_OF_LAYER = { extract:'text', bytes:'text', decode:'text', furniture:'text', punct:'text', lexicon:'words', statement:'text', token:'words', grammar:'pos', morph:'morph', stance:'props', referent:'refs', relation:'props', np:'props', phrasal:'props', render:'render', ledger:'eot' };
const shortVerdict = w => String(w || '').split(' — ')[0];
const floorId = h => 'fl-' + String(h).replace(/^F/, '').replace('½', 'h');

// the stance class, re-declared here (same shape as the organ) so the page can
// COUNT and LABEL the positions the stance layer carried, never to change them.
const STANCE_CLASS = [
  ['support', /\b(?:supports?|supported|supporting|support(?:ive)?|backs?|backed|backing|endors(?:e|es|ed|ing)|favou?rs?|favou?red|favou?ring|champions?|championed|advocat(?:e|es|ed|ing)|defends?|defended|prais(?:e|es|ed|ing)|pro|solidarity|ally)\b/i],
  ['oppose', /\b(?:oppos(?:e|es|ed|ing)|against|anti|condemn(?:s|ed|ing)?|criticiz(?:e|es|ed|ing)|criticis(?:e|es|ed|ing)|denounc(?:e|es|ed|ing)|boycott(?:s|ed|ing)?|resist(?:s|ed|ing)?|protest(?:s|ed|ing)?)\b/i],
];
const stanceClass = label => { const t = String(label || ''); for (const [k, re] of STANCE_CLASS) if (re.test(t)) return k; return null; };

// ── the polytemporality rule (declared on this page, same shape as the organ) ─
const MODAL_FUT = /\b(will|shall|'ll)\b/i;
const HAD_PART = /\bhad\s+\w+(ed|en|wn|ne|de|ad|it)\b/i;
function localTense(t){
  t = String(t || '');
  if (HAD_PART.test(t)) return { v:'Pqp', why:'had + participle — a past before a past' };
  if (MODAL_FUT.test(t)) return { v:'Fut', why:'modal will/shall — analytic future' };
  if (/\b(is|are|am|has|have)\b/i.test(t)) return { v:'Pres', why:'finite present (be/have)' };
  if (/\b(was|were|had|said|saw|came|went|took|gave)\b|\w+ed\b/i.test(t)) return { v:'Past', why:'finite past form or -ed' };
  return { v:'undeclared', why:'no finite verb in the clause — counted, never guessed' };
}

// ── CONFIDENCE: a disclosed, deterministic rubric over the engine's OWN signals.
// NOT a model's probability. Every component is a fact the engine already
// carries; the score is the sum, and the tooltip shows the exact terms.
function confidenceOf(c){
  const terms = [];
  const add = (label, w) => { terms.push([label, w]); return w; };
  let s = 0;
  const V = { bound:['the material binds this edge, same polarity', .45],
              contradicted:['the material binds this edge with the OPPOSITE polarity', .35],
              unbound:['no passage states the whole of the object', .20],
              'beyond-reach':['an endpoint or the verb is beyond this check', .08],
              unheard:['no edge was heard around this claim', .05] }[c.verdict] || ['untyped verdict', .05];
  s += add(V[0], V[1]);
  if (c.grounded) s += add('the span was located verbatim in the source', .25); else s += add('no span — the claim is unlocated', 0);
  if (c.polarityMeasured) s += add('polarity was measured (not negation-led)', .08); else s += add('polarity never measured', 0);
  if (!c.formBased) s += add('both ends resolved to named referents', .10); else s += add('the subject resolved by recurring form, not a named referent', 0);
  if (c.fillers > 1) s += add(`slot competition: ${c.fillers} distinct fillers`, -.12); else s += add('singular — no competing filler', .07);
  if (c.standing === 'corroborated') s += add('corroborated by ≥2 statements', .05); else s += add('single witness', 0);
  const pct = Math.max(0, Math.min(100, Math.round(s * 100)));
  return { pct, terms };
}
function confHTML(c){
  const { pct, terms } = confidenceOf(c);
  const cls = pct >= 60 ? '' : pct >= 35 ? ' mid' : ' low';
  const tip = 'confidence ' + pct + '% — a disclosed rubric over the engine\'s own signals, no model\n' +
    terms.filter(t => t[1] !== 0 || /no |never|unlocated/.test(t[0])).map(t => `  ${t[1] >= 0 ? '+' : ''}${t[1].toFixed(2)}  ${t[0]}`).join('\n');
  return `<span class="conf${cls}" title="${esc(tip)}"><span class="cbar"><i style="width:${pct}%"></i></span>${pct}%</span>`;
}

// ── THE RENDER LENS: the same triple in a reader's word order. A declared
// scaffold (WALS-style register), never a model. English is SVO; SOV and VSO
// are the identical subject–act–object under another order.
const ORDERS = [
  { id:'svo', label:'English · SVO', giver:'the reader\'s own order — subject · act · object', line:c => `${cap(c.end1)} ${c.polarity === '-' ? 'did not ' : ''}${c.label} ${c.end2}.` },
  { id:'sov', label:'SOV',          giver:'the same triple, object before act', line:c => `${cap(c.end1)} ${c.end2} ${c.polarity === '-' ? 'not ' : ''}${c.label}.` },
  { id:'vso', label:'VSO',          giver:'the same triple, act first', line:c => `${cap(c.polarity === '-' ? 'not ' + c.label : c.label)} ${c.end1} ${c.end2}.` },
];

let PRIORS = null, READER = null, LEXICON = null, LEXICON_LONGEST = 0;
// dictionary · Wikipedia · Wikidata: a crossing the page makes only when asked — see holodeck-lookup.js. Starts OFF.
// THE HYPERLEXICON, open to every organ (reading/lexicon.js): its local giver is the English Wiktionary pack on this machine, read by the
// Holodeck's own server (POST /lexicon). An organ asks only about a form the language's priors cannot settle; nothing leaves the machine.
// one client per language the documents measure as: the giver's entries are filtered to that language's own words
const askLexicon = async (forms, lang) => { const r = await fetch('/lexicon', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ forms, lang }) }); return r.ok ? r.json() : null; };
const HLEXS = new Map(), hlexFor = (lang) => { if (!HLEXS.has(lang)) HLEXS.set(lang, makeLexicon({ ask: askLexicon, lang })); return HLEXS.get(lang); };
const HLEX = hlexFor('en');
const LOOKUP = makeLookup({ local: HLEX });   // the page's dictionary parser reads English entries, so the class fill below is English only
let LOOKUPS_ON = false;
const knownWord = w => !!(LEXICON && LEXICON.has(String(w).toLowerCase()));
async function ready(){
  if (READER) return;
  PRIORS = await loadPriors();
  try { const r = await fetch('../vendor/khora/native/priors/morphology-eng.json'); PRIORS.morphRaw = await r.json(); PRIORS.morph = morphologyFromPrior(PRIORS.morphRaw); } catch (e) { PRIORS.morphRaw = { provenance:{} }; }
  LEXICON = new Set(); LEXICON_LONGEST = 0;
  try { Object.keys((PRIORS.posPrior && PRIORS.posPrior.forms) || {}).forEach(w => { LEXICON.add(w.toLowerCase()); if (w.length > LEXICON_LONGEST) LEXICON_LONGEST = w.length; }); } catch (e) {}
  try { Object.keys((PRIORS.morphRaw && PRIORS.morphRaw.forms) || {}).forEach(w => { LEXICON.add(w.toLowerCase()); if (w.length > LEXICON_LONGEST) LEXICON_LONGEST = w.length; }); } catch (e) {}
  READER = await makeEngineRelationReader();
}

// ── THE LADDER on this reading: reading/mhc-ladder.js::runLadder, on the SAME reader the replay ran ─────────────
// READING-POLICY P3: the run states which priors the reader was handed — as loadPriors and makeEngineRelationReader hand them over.
function priorsDeclared(){
  return [
    PRIORS.langIso3
      ? `part of speech — priors/pos-${PRIORS.langIso3}.json, the document's measured language (${PRIORS.lang && PRIORS.lang.lang}); no lemmatizer for it`
      : `part of speech — ${POS_PRIOR_META.giver} (priors/pos-eng.json), with its lexicon consulted where the treebank has no entry (priors/pos-eng-lexicon.json)`,
    `morphology — ${PRIORS.morphRaw?.provenance?.source || 'UniMorph English'} (priors/morphology-eng.json): the lemmatizer that widens same-act, and the verb-form set${PRIORS.langIso3 ? ' — English; not applied to this document' : ''}`,
    'stance class — holodeck-reader.js (same-act widened by stance)',
    'English closed classes — determiners, negation, first person (adapters/text/priors.js)',
    `punctuation — the language's declared norms and its measured abbreviation prior (reading/punctuation.js, janus priors/punctuation-{stem}.json, vendored with khora), joined to the document's own abbreviations (spans.js::deriveAbbreviations)`,
    ...(LOOKUP.count() ? [`hyperlexicon — ${LOOKUP.count()} forms looked up on request (holodeck-lookup.js → kernel/hyperlexicon.js): each witness nominated as a candidate with its giver, licence and address, none licensed; they fill class gaps in the document classifier — the relation reader does not read them`] : []),
  ];
}
// The discrimination arms need material that does NOT support the task: a built-in sample of different content, never the material itself.
function controlFor(analysis){
  const key = analysis.includes(SAMPLES.history.slice(0, 40)) ? 'positions' : 'history';
  return { key, material: materialOf([{ key, label: 'sample · ' + key, text: SAMPLES[key] }]) };
}
// The blanked text, cut into addressed passages, with the control beside it; every rung's declared task with its three arms.
// It starts after the reading is on screen. LADDER_CHARS is the view's own reading cap (LIMIT), so a whole document is scored whole;
// the Floors tab says when a cap cut.
// The verdicts are the READER's ceiling on this material, not a property of the text: the same text under another reader scores otherwise.
const LADDER_CHARS = 80000;
function startLadder(T, R, clean, { readerFeatures = {}, foreign = null, abbreviations = null } = {}){
  T.ladder = { state:'running' };
  setTimeout(async () => {
    const t0 = performance.now();
    let Lr = null, material = null;
    try {
      const text = clean.length > LADDER_CHARS ? clean.slice(0, LADDER_CHARS) : clean;
      material = materialOf([{ key:'text', label:T.doc.label, text }]);
      const ctl = controlFor(text);
      Lr = await runLadder({ material, control: ctl.material, READER: R, priors: priorsDeclared(), reader: R(material.passages) });
      Lr.ms = Math.round(performance.now() - t0); Lr.controlKey = ctl.key; Lr.material = material; Lr.cut = clean.length - text.length;
      T.ladder = { state:'done', L: Lr, priors:'running' };
    } catch (err) { console.error(err); T.ladder = { state:'failed', error: String(err && err.message || err) }; }
    if (T.onLadder) T.onLadder();
    if (!Lr) return;
    // the prior-withheld arm: the same reader built without one prior at a time (the rail's own switches), the floor's task run again.
    // A finding about each prior — earned its keep here, or added nothing — never a change to a floor's verdict.
    const t1 = performance.now();
    try {
      await runPriorArms(Lr, { material, withhold: async key => makeEngineRelationReader({ features: { ...readerFeatures, [key]: false }, foreign, abbreviations }) });
      Lr.priorMs = Math.round(performance.now() - t1); T.ladder.priors = 'done';
    } catch (err) { console.error(err); T.ladder.priors = 'failed'; T.ladder.priorError = String(err && err.message || err); }
    if (T.onLadder) T.onLadder();
  }, 80);
}

// ── build the trace: run the real organs, recording each transformation ──────
// punctuation is settled at tokenization (reading/tokenize.js): POS is only ever asked about word forms
let ABBREV = null;   // the splitter's own abbreviation knowledge for the text being read
let ALIASES = new Map(), LEXSTEP = null;   // dotted forms the hyperlexicon resolved as aliases of other words, and what the consult did
let PUNCT = null;    // the language's punctuation norms (declared) and its abbreviation prior (measured): reading/punctuation.js
const abbrevOf = text => deriveAbbreviations(String(text ?? '').replace(/\r\n/g, '\n').replace(/\r/g, '\n'));
// the document's own abbreviations (the splitter's) joined to the language's measured ones: "Dr." is one word, its dot kept, wherever it comes from
const abbrevAll = () => new Set([...(PUNCT ? PUNCT.abbreviations : []), ...(ABBREV || []), ...ALIASES.keys()].map(x => String(x).toLowerCase()));
// the splitter compares case-sensitively ("Dr"), the measured prior is lower case: hand it every case a title takes
const abbrevForSplitter = () => new Set([...abbrevAll()].flatMap(a => [a, a.charAt(0).toUpperCase() + a.slice(1), a.toUpperCase()]));
const scanOpts = (extra = {}) => ({ norms: PUNCT && PUNCT.norms, abbreviations: abbrevAll(), ...extra });
const wordsIn = (text, base) => scanPunctuation(text, scanOpts({ base })).words.map(({ w, s, e }) => ({ w, s, e }));
const WORDS_ANIMATED = 700;

function buildTrace(doc, clean, claims, features, extraction){
  const ev = []; const t0 = performance.now();
  const push = (stage, kind, msg, extra) => { ev.push({ i:ev.length, t:performance.now() - t0, stage, kind, msg, ...(extra || {}) }); return ev.length - 1; };
  const analysis = doc.analysis;
  const nBytes = utf8Len(analysis);

  // the EXTRACTION is auditable: which extractor ran, what the sniff measured, whether the platform
  // converter was called (and why), and which text was kept — every step on the record, never blind.
  if (extraction){
    push('extract', 'superposition', `${extraction.held} extraction reading${extraction.held === 1 ? '' : 's'} held in parallel — the gate does not discard them`, { s:0, e:0, data:{ extraction } });
    extraction.readings.forEach((r, i) => push('extract', r.ok ? 'reading' : 'reading-failed', r.ok
      ? `reading ${i + 1}: ${r.extractor} → reads as words ${(r.sniff.reads * 100).toFixed(0)}% · ${r.sniff.verdict}${i === extraction.collapsed ? ' — COLLAPSED as the reading' : ''}`
      : `reading ${i + 1}: ${r.extractor} → not available (${r.why})`, { s:0, e:0, data:{ reading: r, i } }));
    { const r = extraction.readings[extraction.collapsed]; (r && r.junctions || []).forEach((jx) => push('extract', 'startle', `startle on page ${jx.page}: ${jx.why}. Held: “${jx.spaced}” and “${jx.joined}”. Read as ${jx.decision === 'join' ? '“' + jx.joined + '”' : '“' + jx.spaced + '”'}${jx.flipped ? ' (flipped by you)' : ''} — ${jx.by}`, { s:0, e:0, data:{ junction: jx } })); }
    if (extraction.revisions && extraction.revisions.length) push('extract', 'revision', `the collapse was revised ${extraction.revisions.length}× — append-only: ${extraction.revisions.map(v => v.extractor).join(' → ')}`, { s:0, e:0 });
  }

  const hash = sha256Hex(analysis);
  const srcKey = sha256Hex(analysis).slice(0, 20);
  push('bytes', 'source', `${esc(doc.label)} · ${nBytes.toLocaleString()} bytes utf-8 · sha-256 ${hash.slice(0,20)}…`, { s:0, e:analysis.length });

  push('decode', 'text', `decoded to ${analysis.length.toLocaleString()} characters — the address space is BYTES, the reading is in characters`, { s:0, e:analysis.length });

  const blanks = [];
  if (features.furniture !== false) for (let i = 0; i < analysis.length; i++) if (analysis[i] !== ' ' && clean[i] === ' ') blanks.push(i);
  const blankRuns = [];
  for (const i of blanks){ const last = blankRuns[blankRuns.length - 1]; if (last && last.e === i) last.e = i + 1; else blankRuns.push({ s:i, e:i + 1 }); }
  push('furniture', 'blank', features.furniture === false
    ? `furniture layer OFF — the raw material goes to the reader as it stands (markup folded as content, disclosed)`
    : blanks.length ? `blanked ${blanks.length.toLocaleString()} characters of markup/CSS/URL furniture to spaces — every offset is unchanged` : `no markup furniture found — this material is already prose, read as it stands`,
    { s:0, e:analysis.length, data:{ runs:blankRuns } });

  ABBREV = abbrevOf(clean);
  // ── the hyperlexicon: what the priors could not settle, and what its local giver said ──
  { const X = LEXSTEP;
    if (!X || !X.on) push('lexicon', 'off', `hyperlexicon layer OFF — nothing is looked up; a dotted form the priors do not know may end a sentence, and a form the class prior lacks stays a gap`, { s:0, e:0, data:{ off:true } });
    else if (X.gap) push('lexicon', 'gap', `the hyperlexicon was not reached — ${X.gap}; the reading carries on with the priors alone`, { s:0, e:0, data:X });
    else {
      push('lexicon', 'ask', `asked the hyperlexicon about ${X.asked.toLocaleString()} form${X.asked === 1 ? '' : 's'} the priors could not settle — ${X.junctions} possible sentence end${X.junctions === 1 ? '' : 's'} after a dotted form, ${X.posAsked} form${X.posAsked === 1 ? '' : 's'} with no class — ${X.giver.name}, the ${X.giver.snapshot} dump, on this machine · ${Math.round(X.ms)} ms`, { s:0, e:0, data:{ asked:X.asked, giver:X.giver } });
      for (const a of X.aliases){ const at = clean.indexOf(a.form); push('lexicon', a.kept ? 'alias' : 'alias-refused', a.kept
        ? `“${a.form}” is one word: the hyperlexicon lists it as a form of ${a.of.map(o => `“${o}”`).join(' and ')} — the period belongs to the word, so no sentence ends inside it (${a.n} place${a.n === 1 ? '' : 's'})`
        : `“${a.form}” is listed as a form of ${a.of.map(o => `“${o}”`).join(' and ')}, but ${a.why} — so its period may still end a sentence`, { s:at, e:at >= 0 ? at + a.form.length : 0, data:a }); }
      for (const f of X.posFound){ const at = clean.indexOf(f.form); push('lexicon', 'class', `“${f.form}” → ${f.upos.length ? f.upos.join(' / ') : 'listed, with no class the reader maps'} — attested by ${X.giver.name}, a witness for the class layer`, { s:at, e:at >= 0 ? at + f.form.length : 0, data:f }); }
    }
  }
  // the splitter and the punctuation scan share ONE abbreviation knowledge: the language's measured prior joined to this text's own
  const sents = splitSentences(clean, { abbreviations: abbrevForSplitter() });
  sents.forEach((s, i) => push('statement', 'statement',
    `statement ${i + 1} of ${sents.length} · bytes ${charToByte(analysis, s.offset)}–${charToByte(analysis, s.offset + s.text.length)} · “${clamp(s.text.replace(/\s+/g,' ').trim(), 74)}”`,
    { s:s.offset, e:s.offset + s.text.length, data:{ order:i, len:sents.length } }));

  const words = [];
  const punct = [];   // PUNCT/SYM by Unicode category: their own tokens, never sent to the class prior
  // the whole text is scanned once for punctuation: every mark kept with its role, the sentences with their mood, the containers a proposition nests in,
  // and — for a scan, or a text with line structure — the boundaries the page's own layout supplies
  const SCAN = scanPunctuation(clean, scanOpts({ cues: [...cuesFromBlankLines(clean), ...(doc.layout ? cuesFromLayout(doc.layout, clean) : [])] }));
  for (const s of sents) for (const w of wordsIn(s.text, s.offset)) words.push(w);
  for (const p of SCAN.punct) punct.push(p);
  { const P = SCAN.structure, moods = {}; P.sentences.forEach(x => { moods[x.mood] = (moods[x.mood] || 0) + 1; });
    push('punct', 'scan', `${SCAN.punct.length} marks kept · ${P.sentences.length} sentences (${Object.entries(moods).map(([k, v]) => v + ' ' + k).join(', ') || 'none'}) · ${P.containers.length} container${P.containers.length === 1 ? '' : 's'} · ${P.notes.abbreviations} abbreviation dot${P.notes.abbreviations === 1 ? '' : 's'} attached · norms for “${P.notes.lang || 'default'}” ${P.notes.normsKnown ? 'declared' : 'not declared — default used'}`, { s:0, e:0, data:{ moods } });
    P.containers.slice(0, 40).forEach(c => push('punct', 'container', `${c.kind} ${c.mark} · depth ${c.depth}${c.mood ? ' · ' + c.mood : ''} · “${clamp(clean.slice(c.s, c.e).replace(/\s+/g, ' '), 56)}”`, { s:c.s, e:c.e, data:{ container:c } }));
    P.notes.unclosed.forEach(u => push('punct', 'gap', `an opening ${u.w} that never closes — kept as a gap, not guessed at`, { s:u.s, e:u.s + 1, data:u })); }

  const shown = words.slice(0, WORDS_ANIMATED);
  const toks = tokenize(clean);
  push('token', 'vocabulary', `${words.length.toLocaleString()} form occurrences · ${new Set(toks).size.toLocaleString()} distinct forms in the reader's own vocabulary`, { s:0, e:0 });
  shown.forEach(w => push('token', 'word', `“${w.w}” · bytes ${charToByte(analysis, w.s)}–${charToByte(analysis, w.e)}`, { s:w.s, e:w.e, data:{ w:w.w } }));
  if (words.length > WORDS_ANIMATED) push('token', 'cap', `+${(words.length - WORDS_ANIMATED).toLocaleString()} more form occurrences — the per-form layers animate the first ${WORDS_ANIMATED.toLocaleString()} (the reading covers all)`, { s:0, e:0 });

  const pos = features.pos === false ? null : PRIORS.posPrior;
  // the document's own definitions and typography settle capitalised forms the priors cannot place (candidates, with ranges)
  const DOCC = pos ? documentClassifier(clean, { posPrior: pos, lemmatizer: PRIORS.lemmatizer, lookups: features.lexicon === false ? null : LOOKUP.cache }) : null;
  let gaps = 0, ambiguous = 0, classified = 0;
  shown.forEach(w => {
    if (!pos){ push('grammar', 'off', `“${w.w}” → POS layer OFF — no class prior is read; the form is carried as a bare string`, { s:w.s, e:w.e, data:{ w:w.w, found:false, off:true } }); return; }
    const c = DOCC ? DOCC(w.w) : classifyForm(w.w, { posPrior: pos, lemmatizer: PRIORS.lemmatizer });
    if (!c.found){ gaps++; push('grammar', 'gap', `“${w.w}” → no entry in the class prior — a typed gap, never a guess`, { s:w.s, e:w.e, data:{ w:w.w, found:false } }); return; }
    classified++;
    if (c.candidates.length > 1) ambiguous++;
    const parts = c.candidates.slice(0, 3).map(k => `${k.upos} ${k.share == null ? 'attested' : (k.share * 100).toFixed(0) + '%'}→${k.thraxClass || '—'}`).join(' · ');
    push('grammar', 'class', `“${w.w}” → ${c.via.length ? `(looked up as “${c.form}” — ${c.via.map(v => v.step).join(' + ')}) ` : ''}${parts}${c.inferred ? ' — INFERRED from the act, not attested for this form' : ''}${c.candidates.length > 1 ? ' — ambiguous, left unresolved' : ''}`, { s:w.s, e:w.e, data:{ w:w.w, found:true, inferred:!!c.inferred, candidates:c.candidates.slice(0,3), total:c.total, form:c.form, via:c.via, attested:c.attested || null, act:c.act || null, evidence:c.evidence ? c.evidence.map(x => ({ kind:x.kind, at:x.at })) : null } });
  });

  const lem = features.morph === false ? null : PRIORS.lemmatizer;
  let acts = 0, morphGaps = 0;
  shown.forEach(w => {
    if (!lem){ push('morph', 'off', `“${w.w}” → morphology layer OFF — no lemma is recovered; the form stays itself`, { s:w.s, e:w.e, data:{ w:w.w, lemmas:[], stems:[], off:true } }); return; }
    const lf = lookupForm(w.w); const lemmas = [...lem.lemmasOf(lf)]; const stems = [...stemsOf(lf)];
    if (!lemmas.length && !stems.length){ morphGaps++; push('morph', 'gap', `“${w.w}” → no act recovered — a form the prior does not know and the rule cannot recover stays a form`, { s:w.s, e:w.e, data:{ w:w.w, lemmas:[], stems:[] } }); return; }
    acts++;
    push('morph', 'act', `“${w.w}” → act {${lemmas.slice(0,3).map(l=>`“${l}”`).join(', ') || '—'}}${stems.length ? ` · rule {${stems.slice(0,2).join(', ')}}` : ''}${lemmas.length > 1 ? ' — a SET, never one chosen' : ''}`, { s:w.s, e:w.e, data:{ w:w.w, lemmas:lemmas.slice(0,4), stems:stems.slice(0,3) } });
  });

  // stance layer: count + name the positions the stance class carried
  const stanceClaims = claims.filter(c => stanceClass(c.label));
  push('stance', features.stance === false ? 'off' : 'on',
    features.stance === false
      ? `stance layer OFF — a position ("is pro", "supports") is not equated with its class; only the base reader's own verbs bind`
      : stanceClaims.length
        ? `${stanceClaims.length} position${stanceClaims.length === 1 ? '' : 's'} read as ${[...new Set(stanceClaims.map(c => stanceClass(c.label)))].join(' / ')} — "is pro" binds a source's "in support of" without either label rewritten`
        : `no stance position in this material — the layer had nothing to carry`,
    { s:0, e:0, data:{ n:stanceClaims.length } });

  // ── referents ──
  // The replay's referents are the ends of the relations read, so F1 here is read off F2. Which of them the name rule (F1's own
  // route, cast.js: capitalised runs the text repeats) would have admitted is measured, and every other one is recorded as a
  // REVISION: F2 added a referent F1 never had. The record is appended (the ledger's revise event), never written over.
  // if the name rule itself cannot run, no revision is claimed: a failure of the route is not a finding about F2
  let nameRule = null;
  try { nameRule = [...new Set(discoverReferents(extractSurfaces(splitSentences(clean, { abbreviations: abbrevForSplitter() }), {}), {}).events.map(x => x.surface))]; } catch (e) { console.warn('the name rule did not run; no F2→F1 revision is recorded', e); }
  const byRule = k => !nameRule || nameRule.includes(k) || nameRule.some(sf => { try { return namesCorefer(k, sf); } catch (e) { return false; } });
  const refs = new Map();
  for (const c of claims) for (const nm of [c.end1, c.end2]) {
    if (!nm) continue; const k = String(nm);
    const r = refs.get(k) || { n:k, c:0, s:c.s, e:c.e, b0:c.b0, byRule: byRule(k) };
    r.c++; if (c.s < r.s) { r.s = c.s; r.e = c.e; r.b0 = c.b0; }
    refs.set(k, r);
  }
  [...refs.values()].sort((a,b) => a.s - b.s).forEach(r => { r.ev = push('referent', 'name',
    `referent “${r.n}” — first read at byte ${r.b0 == null ? '—' : r.b0} · stands in ${r.c} relation${r.c>1?'s':''} · ${r.byRule ? 'admitted by the name rule' : 'NOT a name the rule admits: it will come from a relation’s end (F2 revising F1)'}`, { s:r.s, e:r.e, data:r }); });

  // ── relations ──
  claims.forEach(c => {
    const v = c.verdict, ri = ev.length;
    push('relation', v, `${c.end1} —${c.label}→ ${c.end2} · standing: ${v === 'bound' ? 'read' : v === 'beyond-reach' ? 'beyond reach' : v === 'unbound' ? 'unbound' : v === 'contradicted' ? 'contradicted' : 'unheard'} · polarity ${c.polarity} · byte ${c.b0 == null ? '—' : c.b0}–${c.b1} · tense ${c.tense.v}`,
      { s:c.s, e:c.e, data:c });
    for (const nm of [c.end1, c.end2]){ const r = refs.get(String(nm)); if (!r || r.byRule || r.revised) continue; r.revised = true;
      push('relation', 'revision', `↺ “${r.n}” — a referent the name rule had not admitted, added from this relation’s end: F2 revises F1`, { s:c.s, e:c.e, data:{ revises:r.ev, by:ri, from:'F2', to:'F1', n:r.n } }); }
  });

  // ── render ──
  claims.slice(0, 40).forEach(c => push('render', 'order', `“${ORDERS[0].line(c)}” — English SVO · the same triple is also read SOV and VSO`, { s:c.s, e:c.e, data:c }));

  // ── EOT / ledger ──
  const led = new EotLedger({ artifact:'reading-demo', encoding:'utf8' });
  const srcId = led.source({ kind:'document', locator:srcKey, anchor:byteRange(0, nBytes), meta:{ label:doc.label } });
  push('ledger', 'source', `source stored once under its own bytes → ${srcId} · anchor byteRange(0, ${nBytes})`, { s:0, e:0, data:{ srcId } });

      { name: 'textutil (macOS)', run: async () => { const c = await convert(buf); return c && c.text; } },
      { name: 'the browser’s own parse (readable text, markup dropped)', run: async () => { const d = new DOMParser().parseFromString(htmlReading(new TextDecoder().decode(buf)).html, 'text/html'); return [...d.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,pre,blockquote,td,th')].filter((e) => !e.querySelector('p,li,pre,blockquote')).map((e) => e.textContent.trim()).filter(Boolean).join('\n'); } },
    ] });
  } else {
    const raw = new TextDecoder().decode(buf);
    // a delimited table: each row is read as a statement about its first cell, the way its columns name it
    if (/\.(csv|tsv)$/i.test(file.name)) { const c = csvReading(raw, file.name); if (c.statements) return run(c.statements, file.name); }
    return run(raw, file.name);
  }
  if (PDF_STARTLES && PDF_STARTLES.length) settleJunctions(E, PDF_STARTLES, prior);
  const chosen = E.collapsed != null ? E.readings[E.collapsed] : null;
  if (!chosen || !chosen.text || chosen.text.trim().length < 8) return refuse(file.name, kind === 'pdf' ? 'pdf-no-text' : kind === 'image' ? 'image' : 'binary', {});
  if (chosen.sniff.verdict === 'unconfirmed') return refuse(file.name, 'pdf-unreadable', { reads: chosen.sniff.reads });
  const viaOcr = OCR_META && /tesseract/.test(chosen.extractor);
  return run(chosen.text, file.name + (viaOcr ? ` — ${chosen.extractor} · ${OCR_META.pages} page${OCR_META.pages === 1 ? '' : 's'}, ${OCR_META.conf}% mean word confidence` : ''), { extraction: E, layout: viaOcr && OCR_META.layout && OCR_META.layout.pages.length ? OCR_META.layout : null });
}

// ── input wiring ──
const drop = $('drop'), file = $('file'), ta = $('ta');
drop.addEventListener('click', () => file.click());
file.addEventListener('change', async () => { const f = file.files[0]; if (f) readFile(f); });
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('hot'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('hot'); }));
drop.addEventListener('drop', async ev => { const f = ev.dataTransfer.files && ev.dataTransfer.files[0]; if (f) return readFile(f); const t = ev.dataTransfer.getData('text'); if (t) run(t, 'dropped text'); });
$('read').addEventListener('click', () => run(ta.value, 'pasted text'));
$('clear').addEventListener('click', () => { ta.value = ''; });
$('samples').addEventListener('click', e => { const s = e.target.dataset.s; if (s){ ta.value = SAMPLES[s]; run(SAMPLES[s], 'Sample extraction'); } });
// a WHOLE document: the Holodeck's own published sample set (holodeck-samples), one account read end to end — nothing cut, every prior loaded
const WHOLE_URL = 'https://scores-patch-points.github.io/holodeck-samples/titanic-1912/readings.json';
let WHOLE = null;
async function wholeDocument(type){
  if (!WHOLE){ const r = await fetch(WHOLE_URL); if (!r.ok) throw new Error(`HTTP ${r.status} from the sample set`); WHOLE = (await r.json()).readings || []; }
  const d = WHOLE.find(x => x.type === type) || WHOLE[0]; if (!d) return null;
  // DOMParser documents are inert: no script runs and no image loads
  const text = new DOMParser().parseFromString(String(d.html || ''), 'text/html').body.textContent.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
  return { label: d.title, text };
}
$('samples').addEventListener('click', async e => {
  const b = e.target.closest('[data-doc]'); if (!b) return;
  b.disabled = true; const was = b.textContent; b.textContent = 'fetching…';
  try { const d = await wholeDocument(b.dataset.doc); if (d){ ta.value = d.text; await run(d.text, d.label); } }
  catch (err) { alert('The whole document could not be fetched: ' + (err && err.message || err)); }
  finally { b.disabled = false; b.textContent = was; }
});

// The document's language is MEASURED (the suite's own detector: script, then words and character n-grams; it abstains rather than guess),
// and its part-of-speech prior is that language's, from the same shipped priors. English stays the default and the fallback.
const POS_FILE = { en:'eng', fr:'fra', de:'deu', es:'spa', it:'ita', pt:'por', nl:'nld', sv:'swe', da:'dan', no:'nob', pl:'pol', cs:'ces', ro:'ron', ru:'rus', uk:'ukr', tr:'tur', fi:'fin', id:'ind', ca:'cat', hu:'hun', el:'ell', he:'heb', ar:'arb', hi:'hin', vi:'vie', ko:'kor', ja:'jpn', fa:'fas', la:'lat' };
async function priorFor(text){
  await ready(); PRIORS.posEng ??= PRIORS.posPrior; PRIORS.lemEng ??= PRIORS.lemmatizer;
  let d = null; try { d = detectLang(text); } catch (e) {}
  try { PUNCT = await loadPunctuation(new URL('./', import.meta.url), d && d.confident ? d.lang : 'en'); } catch (e) { PUNCT = null; }
  const f = d && d.confident && d.lang !== 'en' ? POS_FILE[d.lang] : null;
  if (f) { try { const p = await (await fetch(`../vendor/khora/native/priors/pos-${f}.json`)).json(); if (p && p.forms) { PRIORS.posPrior = p; PRIORS.lemmatizer = null; PRIORS.lang = d; PRIORS.langIso3 = f; return d; } } catch (e) {} }
  PRIORS.posPrior = PRIORS.posEng; PRIORS.lemmatizer = PRIORS.lemEng; PRIORS.lang = d; PRIORS.langIso3 = null; return d;
}
async function run(text, label, opt = {}){
  try { await priorFor(text); } catch (e) { console.warn('language prior', e); }
  const btn = $('read'); const was = btn.textContent; btn.textContent = 'reading…'; btn.disabled = true;
  features = { ...DEFAULT_FEATURES }; BASELINE = null; LAST_TAB = 'text';
  const d = $('p-delta'); if (d) d.hidden = true; const r = $('refuse'); if (r) r.hidden = true;
  try { await read(text, label, features, { animate:true, extraction: opt.extraction || null, layout: opt.layout || null }); }
  catch (err){ alert('The reading failed: ' + (err && err.message || err)); console.error(err); }
  finally { btn.textContent = was; btn.disabled = false; }
}

// several sources, one log (reading/corpus.js): the page supplies the priors and the verb test, the organ owns none
async function corpusDeps(){
  await ready();
  const pos = PRIORS.posPrior, memo = new Map();
  const isVerb = w => { const c = classifyForm(String(w).toLowerCase(), { posPrior: pos, lemmatizer: PRIORS.lemmatizer }); return !!(c.found && c.candidates && c.candidates[0] && c.candidates[0].upos === 'VERB'); };
  return { hash: sha256, diaNorm, splitSentences, wordsIn, extractSurfaces, discoverReferents, resolvePronouns, namesCorefer, genericTokens, isVerb, sameBeing: makeSameBeing(),
    classifyAt: prefix => documentClassifier(prefix, { posPrior: pos, lemmatizer: PRIORS.lemmatizer, lookups: LOOKUP.cache, memo }) };
}
const SOURCES = mountSources($('sources'), { makeDeps: corpusDeps, openInReader: (t, l) => { ta.value = t; run(t, l); }, currentText: () => ta.value });
$('addsrc').addEventListener('click', () => SOURCES.addCurrent());
$('exsrc').addEventListener('click', () => SOURCES.example());
const OFFLINE = startOffline();   // silent: it only makes the files local; nothing on the page announces it
window.__demo = { offline: OFFLINE, sources: SOURCES, view: () => cur, read, run, wholeDocument, lookup: LOOKUP, json:() => (cur ? readingJSON(cur.T) : null), text:() => (cur ? diagrammedText(cur.T) : null), current:() => (cur ? cur.T : null), features:() => features, net };
</script>
